name: CI Observer

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-observer-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  collect:
    name: collect completed-run evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # For workflow_run, github.sha is the trusted default-branch commit.
      # The observed PR head SHA remains data and is never checked out.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Fetch read-only Actions metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          out="$RUNNER_TEMP/ci-observer"
          mkdir -p "$out"
          gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            --paginate --slurp \
            "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs?per_page=100" \
            > "$out/jobs-pages.json"
          gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/$GITHUB_REPOSITORY/actions/cache/usage" \
            > "$out/cache-usage.json"
          gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/$GITHUB_REPOSITORY/actions/cache/storage-limit" \
            > "$out/cache-limit.json"
      - name: Build timing and cache receipt
        run: |
          python3 scripts/ci-observer.py \
            --event "$GITHUB_EVENT_PATH" \
            --jobs-pages "$RUNNER_TEMP/ci-observer/jobs-pages.json" \
            --cache-usage "$RUNNER_TEMP/ci-observer/cache-usage.json" \
            --cache-limit "$RUNNER_TEMP/ci-observer/cache-limit.json" \
            --output "$RUNNER_TEMP/ci-observer/receipt.json"
      - name: Upload CI observer receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-observer-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/ci-observer/receipt.json
          retention-days: 30
          if-no-files-found: warn
