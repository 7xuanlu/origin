name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual trigger for re-running a release build (e.g. after transient CI failure).
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing git tag to build (e.g. v0.1.2)'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Resolved once, used everywhere. workflow_dispatch supplies the tag via input;
  # push supplies it via GITHUB_REF.
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  prepare-release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          fetch-tags: true

      - name: Verify release checkout
        shell: bash
        run: |
          expected=$(git rev-list -n1 "refs/tags/$RELEASE_TAG")
          actual=$(git rev-parse HEAD)
          if [[ "$actual" != "$expected" ]]; then
            echo "ERROR: checkout $actual does not match refs/tags/$RELEASE_TAG ($expected)"
            exit 1
          fi

      - name: Validate version consistency
        run: bash scripts/validate-versions.sh
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}

      - name: Validate README translations and eval provenance
        run: |
          python3 scripts/check-readme-translations.py
          python3 scripts/update-readme-eval.py --check docs/eval/readme_metrics.example.json

      - name: Compose release body
        run: |
          VERSION="${RELEASE_TAG#v}"
          # Extract the latest version section from CHANGELOG.md (between first two ## headings)
          CHANGELOG=$(awk '/^## \['"$VERSION"'\]/{found=1; next} found && /^## \[/{exit} found' CHANGELOG.md)
          # Find the previous tag for the compare link
          PREV_TAG=$(git tag --sort=-version:refname | grep '^v' | sed -n '2p')

          cat > release-body.md <<INSTALL_EOF
          ## What's Changed

          $CHANGELOG

          **Full Changelog**: https://github.com/7xuanlu/wenlan/compare/${PREV_TAG}...${RELEASE_TAG}

          ## Install

          **Wenlan setup (local runtime + daemon):**
          \`\`\`
          npx -y wenlan setup
          \`\`\`

          **MCP connector only:**
          \`\`\`
          npx -y wenlan-mcp
          \`\`\`

          **Exact release setup:**
          \`\`\`
          WENLAN_RELEASE_TAG=${RELEASE_TAG} npx -y wenlan setup
          \`\`\`

          **Shell installer:**
          \`\`\`
          curl -fsSL https://raw.githubusercontent.com/7xuanlu/wenlan/main/install.sh | bash
          \`\`\`

          **Exact shell install for this release:**
          \`\`\`
          curl -fsSL https://raw.githubusercontent.com/7xuanlu/wenlan/${RELEASE_TAG}/install.sh | WENLAN_RELEASE_TAG=${RELEASE_TAG} bash
          \`\`\`
          Downloads exact binaries and prints manual isolated daemon/MCP setup steps.

          > Wenlan works in local memory mode without a local model or API key. Distill cycles are opt-in with \`wenlan models install\` or \`wenlan keys set anthropic\`.
          INSTALL_EOF

          # Strip leading whitespace from heredoc indentation
          sed -i 's/^          //' release-body.md
          echo "Release body written ($(wc -c < release-body.md) bytes)"

      - name: Gate the release behind a prerelease
        run: |
          # release-please already created this release — published, carrying the
          # changelog body — and pushed the tag that triggered this run. Demote it
          # to a prerelease at once: prereleases are excluded from
          # `releases/latest`, so installers keep resolving the last good version
          # while the builds below run. finalize-release promotes it back only
          # after every build + publish job succeeds.
          #
          # A draft cannot serve as the gate. Drafts carry no git tag, and GitHub
          # does not enforce tag uniqueness for drafts, so `gh release create
          # --draft` forged a second, empty release beside the real v0.12.0.
          # `--repo` is passed explicitly so this never depends on git context.
          gh release edit "$RELEASE_TAG" \
            --prerelease \
            --notes-file release-body.md \
            --repo "$GITHUB_REPOSITORY" \
            || gh release create "$RELEASE_TAG" \
              --prerelease \
              --title "$RELEASE_TAG" \
              --notes-file release-body.md \
              --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Build & Publish ${{ matrix.target }}
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            archive: tar.gz
            artifact_name: wenlan-darwin-arm64
          # x86_64-apple-darwin dropped from v0.7.0: `ort` 2.x does not
          # publish prebuilt ONNX Runtime binaries for Intel Mac. Adding it
          # back requires compiling ONNX from source (~15min build) or
          # switching to the `ort-tract` backend. Tracked as follow-up.
          # Native ARM Linux runner is free for public repos
          # (ubuntu-24.04-arm, 4 vCPU Cortex / 16GB). Drops cross entirely
          # for aarch64: no Docker container, no Cross.toml, no OpenSSL
          # version chasing. Same setup as x86 below.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: tar.gz
            artifact_name: wenlan-linux-arm64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            archive: tar.gz
            artifact_name: wenlan-linux-x64
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            archive: zip
            artifact_name: wenlan-windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          fetch-tags: true

      - name: Verify release checkout
        shell: bash
        run: |
          expected=$(git rev-list -n1 "refs/tags/$RELEASE_TAG")
          actual=$(git rev-parse HEAD)
          if [[ "$actual" != "$expected" ]]; then
            echo "ERROR: checkout $actual does not match refs/tags/$RELEASE_TAG ($expected)"
            exit 1
          fi

      - name: Validate version consistency
        if: runner.os != 'Windows'
        run: bash scripts/validate-versions.sh
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}

      # rust-toolchain.toml pins the workspace to 1.95.0. The previous
      # `@stable` install installed targets against the stable channel and
      # cargo ran with 1.95.0 (per rust-toolchain.toml override), so
      # `--target x86_64-apple-darwin` failed with `can't find crate for core`
      # — the target was added to the wrong toolchain. Pin explicitly to
      # mirror ci.yml.
      - name: Install Rust 1.95.0 with matrix target
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master 2026-05-13
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}

      # vcpkg sqlite3 for Windows — libsql 0.9 needs `sqlite3.lib` at link
      # time and does not bundle SQLite on Windows. Mirrors ci.yml's test
      # step. GitHub `windows-2022` runner ships vcpkg preinstalled.
      - name: Install sqlite3 (Windows only)
        if: matrix.os == 'windows-2022'
        shell: pwsh
        run: |
          vcpkg install sqlite3:x64-windows-static-md
          "LIB=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static-md\lib;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Set up Vulkan SDK (Windows only)
        if: matrix.os == 'windows-2022'
        shell: pwsh
        run: |
          & scripts/setup-vulkan-sdk-windows.ps1
          # The release keeps the official loader beside wenlan-server.exe.
          # Windows searches the application directory before system PATH, so
          # a driverless machine can start and select the CPU backend while a
          # GPU machine still discovers vendor ICDs through this loader.
          $loaderDir = "target\${{ matrix.target }}\release"
          & scripts/stage-vulkan-loader-windows.ps1 `
            -DestinationDirectory $loaderDir

      - name: Configure MSVC Ninja (Windows release)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          & scripts/setup-msvc-ninja-windows.ps1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
          cache-all-crates: "true"

      # rust-lld shipped with the Rust toolchain (~3-5min faster link
      # than MSVC link.exe on our binary sizes). rustup does NOT proxy
      # rust-lld, so its path must be discovered via `rustc --print
      # sysroot`. Export RUSTFLAGS via $GITHUB_ENV so the Build step
      # picks it up.
      - name: Configure rust-lld linker (Windows)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $sysroot = (rustc --print sysroot).Trim()
          $lld = Join-Path $sysroot "lib/rustlib/x86_64-pc-windows-msvc/bin/rust-lld.exe"
          if (-not (Test-Path $lld)) {
            Write-Host "rust-lld.exe not found at $lld, listing sysroot:"
            Get-ChildItem -Recurse -Filter rust-lld.exe -Path $sysroot
            throw "rust-lld.exe missing"
          }
          $rustflags = "-C linker=$lld -C linker-flavor=lld-link"
          "RUSTFLAGS=$rustflags" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "RUSTFLAGS=$rustflags"

      # All targets build natively now. aarch64-unknown-linux-gnu uses the
      # free ubuntu-24.04-arm runner, x86_64-unknown-linux-gnu uses
      # ubuntu-24.04. No cross / zigbuild / QEMU needed. Eliminates an
      # entire class of openssl-sys/system-OpenSSL/container-version traps
      # that consumed several PRs for v0.7.0.
      - name: Serialize native build (Windows)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: '"CARGO_BUILD_JOBS=1" | Out-File -FilePath $env:GITHUB_ENV -Append'

      - name: Build
        run: cargo build --release -p wenlan -p wenlan-server -p wenlan-mcp --target ${{ matrix.target }}

      - name: Smoke
        shell: bash
        run: |
          ./target/${{ matrix.target }}/release/wenlan${{ runner.os == 'Windows' && '.exe' || '' }} --help
          ./target/${{ matrix.target }}/release/wenlan-server${{ runner.os == 'Windows' && '.exe' || '' }} --help

      - name: List Windows build artifacts
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: |
          find "target/${{ matrix.target }}/release" -maxdepth 1 -mindepth 1 -print | sort | head -30

      # Windows builds FastEmbed with ort-load-dynamic. The shared stager pins
      # the ort 2.0.0-rc.11-compatible DLL and verifies the archive SHA-256.
      - name: Bundle onnxruntime.dll (Windows)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          & scripts/stage-onnxruntime-windows.ps1 `
            -DestinationDirectory "target\${{ matrix.target }}\release"

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            # No winsw.exe: service-manager 0.11's WinSwServiceManager invokes
            # an API winsw v2 doesn't support. Windows users install via the
            # sc.exe path which requires Administrator elevation. Documented
            # in AGENTS.md.
            7z a "dist/${{ matrix.artifact_name }}.zip" \
              "./target/${{ matrix.target }}/release/wenlan.exe" \
              "./target/${{ matrix.target }}/release/wenlan-server.exe" \
              "./target/${{ matrix.target }}/release/wenlan-mcp.exe" \
              "./target/${{ matrix.target }}/release/onnxruntime.dll" \
              "./target/${{ matrix.target }}/release/vulkan-1.dll" \
              "./target/${{ matrix.target }}/release/VulkanRT-License.txt"
          else
            tar -C "target/${{ matrix.target }}/release" -czf "dist/${{ matrix.artifact_name }}.tar.gz" \
              wenlan wenlan-server wenlan-mcp
          fi

      - name: Smoke packaged Windows release
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $ExtractDir = Join-Path $env:RUNNER_TEMP "wenlan-packaged-smoke"
          Expand-Archive `
            -Path "dist\${{ matrix.artifact_name }}.zip" `
            -DestinationPath $ExtractDir
          $ServerPath = Join-Path $ExtractDir "wenlan-server.exe"
          $OrtPath = Join-Path $ExtractDir "onnxruntime.dll"
          $VulkanLoaderPath = Join-Path $ExtractDir "vulkan-1.dll"
          $VulkanLicensePath = Join-Path $ExtractDir "VulkanRT-License.txt"
          if (-not (Test-Path $ServerPath)) {
            throw "packaged wenlan-server.exe is missing"
          }
          if (-not (Test-Path $OrtPath)) {
            throw "packaged onnxruntime.dll is missing"
          }
          if (-not (Test-Path $VulkanLoaderPath)) {
            throw "packaged vulkan-1.dll is missing"
          }
          if (-not (Test-Path $VulkanLicensePath)) {
            throw "packaged VulkanRT-License.txt is missing"
          }
          & scripts/smoke-windows.ps1 `
            -ExePath $ServerPath

      # Per-binary archive for wenlan-mcp consumed by the Homebrew tap formula.
      # Produced only on the darwin-arm64 leg to match the existing tap entry.
      - name: Package wenlan-mcp tarball for Homebrew (darwin-arm64 only)
        if: matrix.target == 'aarch64-apple-darwin'
        shell: bash
        run: |
          cp "target/${{ matrix.target }}/release/wenlan-mcp" wenlan-mcp
          tar -czf dist/wenlan-mcp-darwin-arm64.tar.gz wenlan-mcp
          rm wenlan-mcp

      # Per-binary archive for the wenlan CLI consumed by the Homebrew tap
      # formula. Darwin-arm64 only — matches the wenlan-mcp tap pattern.
      # Filename intentionally distinct from the multi-binary release tarball
      # `wenlan-darwin-arm64.tar.gz` to avoid clobbering it in `dist/`.
      - name: Package wenlan CLI tarball for Homebrew (darwin-arm64 only)
        if: matrix.target == 'aarch64-apple-darwin'
        shell: bash
        run: |
          cp "target/${{ matrix.target }}/release/wenlan" wenlan
          tar -czf dist/wenlan-cli-darwin-arm64.tar.gz wenlan
          rm wenlan

      # Smoke test: verify the multi-binary release archive contains all three
      # binaries before upload. Catches regressions like a same-named Homebrew
      # tarball clobbering the install.sh-consumed archive (v0.7.0 bug).
      - name: Verify release archive contains wenlan, wenlan-server, wenlan-mcp
        shell: bash
        run: |
          set -e
          if [ "${{ matrix.archive }}" = "tar.gz" ]; then
            contents=$(tar -tzf "dist/${{ matrix.artifact_name }}.tar.gz")
            suffix=""
          else
            contents=$(unzip -l "dist/${{ matrix.artifact_name }}.zip" | awk '{print $NF}')
            suffix=".exe"
          fi
          for bin in wenlan wenlan-server wenlan-mcp; do
            if ! printf '%s\n' "$contents" | grep -qE "(^|/)${bin}${suffix}$"; then
              echo "ERROR: dist/${{ matrix.artifact_name }}.${{ matrix.archive }} missing ${bin}${suffix}"
              echo "--- archive contents ---"
              printf '%s\n' "$contents"
              exit 1
            fi
          done
          for payload in onnxruntime.dll vulkan-1.dll VulkanRT-License.txt; do
            if ! printf '%s\n' "$contents" | grep -qE "(^|/)${payload}$"; then
              echo "ERROR: dist/${{ matrix.artifact_name }}.${{ matrix.archive }} missing ${payload}"
              echo "--- archive contents ---"
              printf '%s\n' "$contents"
              exit 1
            fi
          done
          echo "OK: archive contains binaries and required Windows runtimes"

      - name: Upload archives to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: ${{ env.RELEASE_TAG }}
          # Hold the release as a prerelease while assets upload; finalize-release
          # promotes it only after every build + publish job succeeds.
          prerelease: true
          # Don't touch the release body composed in prepare-release.
          append_body: false
          fail_on_unmatched_files: true

      - name: Upload Homebrew artifacts (wenlan + wenlan-mcp)
        if: matrix.target == 'aarch64-apple-darwin'
        uses: actions/upload-artifact@v4
        with:
          name: homebrew-artifacts
          path: |
            dist/wenlan-cli-darwin-arm64.tar.gz
            dist/wenlan-mcp-darwin-arm64.tar.gz

  docker:
    name: Build & Push Docker Image (${{ matrix.platform }})
    needs: release
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-24.04
            tag-suffix: amd64
          # Native ARM runner — free for public repos. Building arm64
          # under QEMU emulation took 90+min and is the dominant cost
          # of the release pipeline. Native is ~10min instead.
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm
            tag-suffix: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          fetch-tags: true
      - name: Verify release checkout
        shell: bash
        run: |
          expected=$(git rev-list -n1 "refs/tags/$RELEASE_TAG")
          actual=$(git rev-parse HEAD)
          if [[ "$actual" != "$expected" ]]; then
            echo "ERROR: checkout $actual does not match refs/tags/$RELEASE_TAG ($expected)"
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.daemon
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/7xuanlu/wenlan-server:${{ env.RELEASE_TAG }}-${{ matrix.tag-suffix }}

  docker-manifest:
    name: Combine Docker Manifest (multi-arch)
    needs: docker
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create + push multi-arch manifest
        run: |
          TAG="${{ env.RELEASE_TAG }}"
          IMG="ghcr.io/7xuanlu/wenlan-server"
          docker buildx imagetools create -t "$IMG:$TAG" "$IMG:$TAG-amd64" "$IMG:$TAG-arm64"
          docker buildx imagetools create -t "$IMG:latest"  "$IMG:$TAG-amd64" "$IMG:$TAG-arm64"

  publish-crates:
    name: Publish crates.io (wenlan-types + wenlan-mcp)
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          fetch-tags: true

      - name: Verify release checkout
        shell: bash
        run: |
          expected=$(git rev-list -n1 "refs/tags/$RELEASE_TAG")
          actual=$(git rev-parse HEAD)
          if [[ "$actual" != "$expected" ]]; then
            echo "ERROR: checkout $actual does not match refs/tags/$RELEASE_TAG ($expected)"
            exit 1
          fi

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Pre-flight cargo publish dry-run
        # Only wenlan-types — wenlan-mcp's --dry-run resolves wenlan-types from
        # crates.io which doesn't have the new version until the publish step
        # runs. Real wenlan-mcp publish happens after wenlan-types is indexed.
        run: cargo publish -p wenlan-types --dry-run

      - name: Resolve workspace version
        id: version
        run: |
          VERSION=$(grep -E '^version = ' Cargo.toml | head -1 | sed -E 's/version = "([^"]+)".*/\1/')
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Workspace version: $VERSION"

      - name: Publish wenlan-types to crates.io
        # Source-of-truth registry check uses the sparse index (same as the
        # downstream `Wait for ... available` step). The v1 web API lags
        # behind by minutes-to-hours under load and gave false "not
        # published" answers that caused cargo publish to attempt a
        # duplicate upload, failing the job.
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          if curl -sf "https://index.crates.io/we/nl/wenlan-types" | grep -q "\"vers\":\"$VERSION\""; then
            echo "wenlan-types ${VERSION} already on sparse index, skipping publish"
          else
            cargo publish -p wenlan-types
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for wenlan-types to be available on crates.io
        # Poll the sparse index (https://index.crates.io) — that's what
        # the wenlan-mcp publish step reads to resolve its
        # `wenlan-types = "^X.Y.Z"` dep. The v1 web API
        # (`crates.io/api/v1/crates/<name>/<version>`) lags behind the
        # sparse index by minutes-to-hours during load, which caused
        # false negatives (publish succeeded, web API still 404). The
        # sparse index path for any crate `name` is
        # `/<prefix>/<name>` where prefix depends on name length;
        # for 4+ chars: `<first2>/<chars 3-4>/<name>`. `wenlan-types`
        # → `we/nl/wenlan-types`. The index returns NDJSON, one record
        # per published version.
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          INDEX_URL="https://index.crates.io/we/nl/wenlan-types"
          for i in $(seq 1 60); do
            if curl -sf "$INDEX_URL" | grep -q "\"vers\":\"$VERSION\""; then
              echo "wenlan-types ${VERSION} visible on sparse index"; exit 0
            fi
            echo "Waiting for sparse index to publish wenlan-types ${VERSION}... ($i/60)"
            sleep 10
          done
          echo "ERROR: wenlan-types ${VERSION} not visible on sparse index after 10 min"
          echo "Last index response:"
          curl -s "$INDEX_URL" | tail -5
          exit 1

      - name: Publish wenlan-mcp to crates.io
        # Sparse index check (see wenlan-types step) avoids the v1 web API
        # propagation lag that previously caused duplicate-publish failures.
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          if curl -sf "https://index.crates.io/we/nl/wenlan-mcp" | grep -q "\"vers\":\"$VERSION\""; then
            echo "wenlan-mcp ${VERSION} already on sparse index, skipping publish"
          else
            cargo publish -p wenlan-mcp
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-npm:
    name: Publish to npm
    needs: publish-crates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write    # OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          fetch-tags: true
      - name: Verify release checkout
        shell: bash
        run: |
          expected=$(git rev-list -n1 "refs/tags/$RELEASE_TAG")
          actual=$(git rev-parse HEAD)
          if [[ "$actual" != "$expected" ]]; then
            echo "ERROR: checkout $actual does not match refs/tags/$RELEASE_TAG ($expected)"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Ensure npm supports OIDC trusted publishing
        # Trusted publishing (tokenless OIDC) requires npm >= 11.5.1. Node 24's
        # bundled npm may lag; pin to latest so the OIDC handshake is available.
        run: npm install -g npm@latest
      - name: Sync npm version from tag
        working-directory: crates/wenlan-mcp/npm
        run: |
          VERSION="${RELEASE_TAG#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
      - name: Sync setup package version from tag
        working-directory: crates/wenlan-cli/npm
        run: |
          VERSION="${RELEASE_TAG#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
      - name: Copy root README and LICENSE into npm packages
        # npm renders README.md on the package page and surfaces LICENSE on
        # the package metadata. Copying root files ensures both packages
        # always reflect the current project description and the same legal
        # text the daemon ships under.
        run: |
          cp README.md crates/wenlan-mcp/npm/README.md
          cp README.md crates/wenlan-cli/npm/README.md
          cp LICENSE crates/wenlan-mcp/npm/LICENSE
          cp LICENSE crates/wenlan-cli/npm/LICENSE
      - name: Publish wenlan-mcp
        working-directory: crates/wenlan-mcp/npm
        # Skip if version already on npm. Retried releases or re-dispatch
        # workflows would otherwise fail with "You cannot publish over the
        # previously published versions". `npm view <pkg>@<v> version`
        # exits 0 + prints the version when published, exits 1 otherwise.
        run: |
          VERSION="${RELEASE_TAG#v}"
          if npm view "wenlan-mcp@$VERSION" version >/dev/null 2>&1; then
            echo "wenlan-mcp@$VERSION already on npm, skipping"
          else
            npm publish --provenance --access public
          fi
      - name: Publish wenlan
        working-directory: crates/wenlan-cli/npm
        run: |
          VERSION="${RELEASE_TAG#v}"
          if npm view "wenlan@$VERSION" version >/dev/null 2>&1; then
            echo "wenlan@$VERSION already on npm, skipping"
          else
            npm publish --provenance --access public
          fi

  update-homebrew:
    name: Update Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: homebrew-artifacts
          merge-multiple: true
      - name: Compute checksums and update formulae
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          SHA_MCP_DARWIN_ARM64=$(sha256sum wenlan-mcp-darwin-arm64.tar.gz | cut -d' ' -f1)
          SHA_CLI_DARWIN_ARM64=$(sha256sum wenlan-cli-darwin-arm64.tar.gz | cut -d' ' -f1)

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/7xuanlu/homebrew-tap.git" tap
          mkdir -p tap/Formula

          cat > tap/Formula/wenlan-mcp.rb << 'FORMULA'
          class WenlanMcp < Formula
            desc "MCP server for Wenlan — personal agent memory layer"
            homepage "https://github.com/7xuanlu/wenlan"
            version "VERSION_PLACEHOLDER"
            url "https://github.com/7xuanlu/wenlan/releases/download/vVERSION_PLACEHOLDER/wenlan-mcp-darwin-arm64.tar.gz"
            sha256 "SHA_PLACEHOLDER"
            license "Apache-2.0"

            livecheck do
              url :homepage
              strategy :github_latest
            end

            on_macos do
              depends_on arch: :arm64
            end

            def install
              bin.install "wenlan-mcp"
            end

            test do
              assert_match "wenlan-mcp", shell_output("#{bin}/wenlan-mcp --help")
            end
          end
          FORMULA

          sed -i "s/VERSION_PLACEHOLDER/${VERSION}/g" tap/Formula/wenlan-mcp.rb
          sed -i "s/SHA_PLACEHOLDER/${SHA_MCP_DARWIN_ARM64}/g" tap/Formula/wenlan-mcp.rb

          cat > tap/Formula/wenlan.rb << 'FORMULA'
          class Wenlan < Formula
            desc "Wenlan CLI — local-first memory + knowledge layer for AI agents"
            homepage "https://github.com/7xuanlu/wenlan"
            version "VERSION_PLACEHOLDER"
            url "https://github.com/7xuanlu/wenlan/releases/download/vVERSION_PLACEHOLDER/wenlan-cli-darwin-arm64.tar.gz"
            sha256 "SHA_PLACEHOLDER"
            license "Apache-2.0"

            livecheck do
              url :homepage
              strategy :github_latest
            end

            on_macos do
              depends_on arch: :arm64
            end

            def install
              bin.install "wenlan"
            end

            test do
              assert_match "wenlan", shell_output("#{bin}/wenlan --help")
            end
          end
          FORMULA

          sed -i "s/VERSION_PLACEHOLDER/${VERSION}/g" tap/Formula/wenlan.rb
          sed -i "s/SHA_PLACEHOLDER/${SHA_CLI_DARWIN_ARM64}/g" tap/Formula/wenlan.rb

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/wenlan-mcp.rb Formula/wenlan.rb
          git commit -m "wenlan + wenlan-mcp ${VERSION}"
          git push origin HEAD:main

      - name: Verify formula syntax
        run: |
          ruby -c tap/Formula/wenlan-mcp.rb
          ruby -c tap/Formula/wenlan.rb

  finalize-release:
    name: Promote the prerelease
    # Runs only after EVERY build + publish job succeeds. A failure in any of
    # them skips this job (GitHub requires all `needs` to succeed), so the
    # release stays a prerelease — never a `releases/latest` without artifacts.
    needs: [release, docker-manifest, publish-crates, publish-npm, update-homebrew]
    runs-on: ubuntu-latest
    steps:
      - name: Promote
        run: |
          # A genuine prerelease tag (v1.0.0-rc.1) stays a prerelease.
          if [[ "$RELEASE_TAG" == *-* ]]; then
            echo "$RELEASE_TAG is a prerelease tag; leaving it unpromoted."
            exit 0
          fi
          # This job has no actions/checkout, so gh has no git context and
          # `gh release edit` died with "fatal: not a git repository" on every
          # release since the job was added. --repo supplies the context.
          gh release edit "$RELEASE_TAG" \
            --prerelease=false \
            --latest \
            --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
