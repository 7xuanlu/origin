name: Release

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact merged release commit to promote
        required: true
        type: string
      release_tag:
        description: Exact vX.Y.Z tag bound to the merged release commit
        required: true
        type: string
      source_run_id:
        description: Successful release-PR CI run that produced the closed receipt
        required: true
        type: string
      source_run_attempt:
        description: Exact successful attempt of source_run_id
        required: true
        type: string
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  RELEASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.release_sha || github.sha }}

jobs:
  prepare-release:
    name: Create GitHub Release
    needs: [resolve-promotion, bind-release-tag]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          fetch-tags: true

      - name: Verify release checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          checkout_sha="$(git rev-parse HEAD)"
          tag_sha="$(gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "/repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          if [[ "$checkout_sha" != "$RELEASE_SHA" || "$tag_sha" != "$RELEASE_SHA" ]]; then
            echo "ERROR: release SHA $RELEASE_SHA, checkout $checkout_sha, and current tag $tag_sha differ."
            exit 1
          fi

      - name: Validate version consistency
        run: bash scripts/validate-versions.sh
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}

      - name: Validate README translations and eval provenance
        run: |
          python3 scripts/check-readme-translations.py
          python3 scripts/update-readme-eval.py --check docs/eval/readme_metrics.example.json

      - name: Compose release body
        run: |
          VERSION="${RELEASE_TAG#v}"
          # Extract the latest version section from CHANGELOG.md (between first two ## headings)
          CHANGELOG=$(awk '/^## \['"$VERSION"'\]/{found=1; next} found && /^## \[/{exit} found' CHANGELOG.md)
          # Find the previous tag for the compare link
          PREV_TAG=$(git tag --sort=-version:refname | grep '^v' | sed -n '2p')

          cat > release-body.md <<INSTALL_EOF
          ## What's Changed

          $CHANGELOG

          **Full Changelog**: https://github.com/7xuanlu/wenlan/compare/${PREV_TAG}...${RELEASE_TAG}

          ## Install

          **Wenlan setup (local runtime + daemon):**
          \`\`\`
          npx -y wenlan setup
          \`\`\`

          **MCP connector only:**
          \`\`\`
          npx -y wenlan-mcp
          \`\`\`

          **Exact release setup:**
          \`\`\`
          WENLAN_RELEASE_TAG=${RELEASE_TAG} npx -y wenlan setup
          \`\`\`

          **Shell installer:**
          \`\`\`
          curl -fsSL https://raw.githubusercontent.com/7xuanlu/wenlan/main/install.sh | bash
          \`\`\`

          **Exact shell install for this release:**
          \`\`\`
          curl -fsSL https://raw.githubusercontent.com/7xuanlu/wenlan/${RELEASE_TAG}/install.sh | WENLAN_RELEASE_TAG=${RELEASE_TAG} bash
          \`\`\`
          Downloads exact binaries and prints manual isolated daemon/MCP setup steps.

          > Wenlan works in local memory mode without a local model or API key. Distill cycles are opt-in with \`wenlan models install\` or \`wenlan keys set anthropic\`.
          INSTALL_EOF

          # Strip leading whitespace from heredoc indentation
          sed -i 's/^          //' release-body.md
          echo "Release body written ($(wc -c < release-body.md) bytes)"

      - name: Gate the release behind a prerelease
        run: |
          # This workflow creates a prerelease after release-please pushes the
          # receipt-derived tag. Prereleases are excluded from `releases/latest`,
          # so installers keep resolving the last good version while publication
          # runs. finalize-release promotes it only after every channel succeeds.
          #
          # A draft cannot serve as the gate. Drafts carry no git tag, and GitHub
          # does not enforce tag uniqueness for drafts, so `gh release create
          # --draft` forged a second, empty release beside the real v0.12.0.
          # `--repo` is passed explicitly so this never depends on git context.
          set -euo pipefail
          tag_sha="$(gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "/repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          if [[ "$tag_sha" != "$RELEASE_SHA" ]]; then
            echo "ERROR: $RELEASE_TAG moved from release SHA $RELEASE_SHA to $tag_sha."
            exit 1
          fi
          if state="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease 2>/dev/null)"; then
            if [[ "$(jq -r '.isDraft' <<<"$state")" == true ]]; then
              echo "Existing release is unexpectedly a draft."
              exit 1
            fi
            if [[ "$(jq -r '.isPrerelease' <<<"$state")" != true ]]; then
              echo "Existing stable release cannot enter an incremental publication rerun."
              exit 1
            fi
            gh release edit "$RELEASE_TAG" \
              --prerelease=true \
              --notes-file release-body.md \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" \
              --prerelease \
              --title "$RELEASE_TAG" \
              --notes-file release-body.md \
              --repo "$GITHUB_REPOSITORY"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A token-authenticated push can succeed against a private tap while every
      # documented `brew tap` command returns 404. Fail before any package or
      # image publishing unless both the credential and anonymous read path are
      # ready. The release is already demoted above, so a failed preflight cannot
      # leave a half-built version as GitHub's latest release.
      - name: Require a public Homebrew tap
        shell: bash
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          if [[ -z "$HOMEBREW_TAP_TOKEN" ]]; then
            echo "ERROR: HOMEBREW_TAP_TOKEN is required to update 7xuanlu/homebrew-tap."
            exit 1
          fi
          if ! git ls-remote https://github.com/7xuanlu/homebrew-tap.git HEAD >/dev/null; then
            echo "ERROR: https://github.com/7xuanlu/homebrew-tap is not anonymously readable."
            echo "Make the tap public before cutting a release; authenticated push access is not an installation proof."
            exit 1
          fi
          echo "Homebrew tap is anonymously readable."

  resolve-promotion:
    name: Resolve validated release promotion
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release-gate-state: ${{ steps.release-gate.outputs.release-gate-state }}
      release-tag: ${{ steps.release-gate.outputs.release-tag }}
      release-pr-number: ${{ steps.release-gate.outputs.release-pr-number }}
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Resolve release SHA to the trusted observer receipt
        id: release-gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          RELEASE_SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
              echo "ERROR: recovery dispatch must use the default main control plane."
              exit 1
            }
            [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || {
              echo "ERROR: recovery resolver checkout does not match its immutable main control SHA."
              exit 1
            }
            [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
              echo "ERROR: release_sha must be a canonical lowercase SHA."
              exit 1
            }
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] || {
              echo "ERROR: release_tag must be a canonical v-version."
              exit 1
            }
            [[ "$RELEASE_SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ && "$RELEASE_SOURCE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || {
              echo "ERROR: source run identity must be positive integers."
              exit 1
            }
            [[ "$(gh api --method GET \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "/repos/$GITHUB_REPOSITORY" --jq '.default_branch')" == "main" ]] || {
              echo "ERROR: recovery control plane is no longer the repository default branch."
              exit 1
            }
            python3 scripts/release-promotion.py gate-main \
              --repository "$GITHUB_REPOSITORY" \
              --sha "$RELEASE_SHA" \
              --temp-root "$RUNNER_TEMP" \
              --github-output "$GITHUB_OUTPUT" \
              --plan-output "$RUNNER_TEMP/release-promotion-plan.json"
            jq -e \
              --arg sha "$RELEASE_SHA" \
              --arg tag "$RELEASE_TAG" \
              --argjson source_run_id "$RELEASE_SOURCE_RUN_ID" \
              --argjson source_run_attempt "$RELEASE_SOURCE_RUN_ATTEMPT" \
              '.main_sha == $sha and .main_run == null and
               .receipt.run_id == $source_run_id and
               .receipt.run_attempt == $source_run_attempt and
               .main_tree_sha == .receipt.tree_sha and
               ("v" + .receipt.version) == $tag' \
              "$RUNNER_TEMP/release-promotion-plan.json" >/dev/null || {
                echo "ERROR: fresh recovery gate does not exactly match dispatch inputs."
                exit 1
              }
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            tag_sha="$(gh api --method GET \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "/repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
            if [[ "$tag_sha" != "$RELEASE_SHA" || "$(git rev-parse HEAD)" != "$RELEASE_SHA" ]]; then
              echo "ERROR: release tag or checkout differs from immutable release SHA $RELEASE_SHA."
              exit 1
            fi
            python3 scripts/release-promotion.py consume-main-receipt \
              --repository "$GITHUB_REPOSITORY" \
              --sha "$RELEASE_SHA" \
              --temp-root "$RUNNER_TEMP" \
              --github-output "$GITHUB_OUTPUT" \
              --plan-output "$RUNNER_TEMP/release-promotion-plan.json"
          else
            echo "ERROR: unsupported release trigger $GITHUB_EVENT_NAME."
            exit 1
          fi
      - name: Require exact receipt-derived tag
        run: |
          if [[ "${{ steps.release-gate.outputs.release-gate-state }}" != "validated" || "${{ steps.release-gate.outputs.release-tag }}" != "$RELEASE_TAG" ]]; then
            echo "Tag does not match the validated release version."
            exit 1
          fi
      - name: Upload small promotion plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          # This is a same-workflow locator, not a trust anchor. A full rerun
          # replaces it with a new immutable artifact ID; a failed-jobs-only
          # rerun reuses the last successful resolver output. The consumer
          # strictly parses the plan and revalidates every closed receipt/hash.
          name: release-promotion-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/release-promotion-plan.json
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
          overwrite: true

  bind-release-tag:
    name: Bind exact release tag
    needs: resolve-promotion
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      issues: read
    steps:
      - name: Create or verify the lightweight receipt-derived tag
        env:
          GH_READ_TOKEN: ${{ github.token }}
          GH_TAG_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GATE_STATE: ${{ needs.resolve-promotion.outputs.release-gate-state }}
          GATE_TAG: ${{ needs.resolve-promotion.outputs.release-tag }}
          RELEASE_PR_NUMBER: ${{ needs.resolve-promotion.outputs.release-pr-number }}
        run: |
          set -euo pipefail
          [[ "$GATE_STATE" == "validated" && "$GATE_TAG" == "$RELEASE_TAG" ]] || {
            echo "ERROR: resolver did not produce the requested validated tag."
            exit 1
          }
          [[ "$RELEASE_PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo "ERROR: resolver did not produce a canonical release PR number."
            exit 1
          }
          labels="$(GH_TOKEN="$GH_READ_TOKEN" gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "/repos/$GITHUB_REPOSITORY/issues/$RELEASE_PR_NUMBER/labels?per_page=100")"
          jq -e \
            '([.[].name] | index("autorelease: pending") != null) and
             ([.[].name] | index("autorelease: tagged") == null)' \
            <<<"$labels" >/dev/null || {
              echo "ERROR: release PR lifecycle is no longer pending and untagged."
              exit 1
            }
          tag_sha=""
          if tag_sha="$(GH_TOKEN="$GH_READ_TOKEN" gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "/repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha' 2>/dev/null)"; then
            [[ "$tag_sha" == "$RELEASE_SHA" ]] || {
              echo "ERROR: existing $RELEASE_TAG points at $tag_sha, not $RELEASE_SHA."
              exit 1
            }
            exit 0
          fi
          [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] || {
            echo "ERROR: tag-push release requires its existing immutable event tag."
            exit 1
          }
          [[ -n "$GH_TAG_TOKEN" ]] || {
            echo "ERROR: RELEASE_TOKEN is required for historical workflow tag recovery."
            exit 1
          }

          # A historical release commit changes workflow files relative to the
          # default branch. GitHub therefore rejects GITHUB_TOKEN for the ref
          # write and requires a token with Workflows write. Such a token also
          # emits a push event, so take ownership of exactly one resulting
          # legacy Release run and cancel it before publication may continue.
          legacy_runs() {
            GH_TOKEN="$GH_READ_TOKEN" gh api --method GET \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "/repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?event=push&head_sha=$RELEASE_SHA&per_page=100" \
              --jq ".workflow_runs[] | select(.event == \"push\" and .head_sha == \"$RELEASE_SHA\" and .head_branch == \"$RELEASE_TAG\" and .path == \".github/workflows/release.yml\") | .id"
          }
          if [[ -n "$(legacy_runs)" ]]; then
            echo "ERROR: a tag-push Release run already exists before recovery binds the absent tag."
            exit 1
          fi

          if ! GH_TOKEN="$GH_TAG_TOKEN" gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "/repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$RELEASE_TAG" \
            -f "sha=$RELEASE_SHA" >/dev/null; then
            tag_sha="$(GH_TOKEN="$GH_READ_TOKEN" gh api --method GET \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "/repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
            [[ "$tag_sha" == "$RELEASE_SHA" ]] || {
              echo "ERROR: concurrent tag bind does not match $RELEASE_SHA."
              exit 1
            }
          fi

          legacy_run_id=""
          for _ in $(seq 1 60); do
            matching="$(legacy_runs)"
            count="$(sed '/^$/d' <<<"$matching" | wc -l | tr -d ' ')"
            if [[ "$count" == "1" ]]; then
              legacy_run_id="$matching"
              break
            fi
            if [[ "$count" != "0" ]]; then
              echo "ERROR: tag recovery triggered $count matching legacy Release runs."
              exit 1
            fi
            sleep 2
          done
          [[ "$legacy_run_id" =~ ^[1-9][0-9]*$ ]] || {
            echo "ERROR: no unique legacy tag-push Release run appeared after recovery tag creation."
            exit 1
          }
          GH_TOKEN="$GH_READ_TOKEN" gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "/repos/$GITHUB_REPOSITORY/actions/runs/$legacy_run_id/cancel" >/dev/null
          for _ in $(seq 1 30); do
            state="$(GH_TOKEN="$GH_READ_TOKEN" gh api --method GET \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "/repos/$GITHUB_REPOSITORY/actions/runs/$legacy_run_id" \
              --jq '[.status, (.conclusion // "")] | @tsv')"
            if [[ "$state" == $'completed\tcancelled' ]]; then
              echo "Cancelled duplicate legacy tag-push Release run $legacy_run_id."
              exit 0
            fi
            sleep 2
          done
          echo "ERROR: legacy tag-push Release run $legacy_run_id did not reach cancelled."
          exit 1

  app-bundle:
    name: Build macOS desktop app bundle
    needs: [resolve-promotion, bind-release-tag]
    runs-on: macos-14
    # The notary wait is the long pole and it is not the only one: this job
    # compiles the whole workspace from scratch first (no Cargo cache here,
    # only pnpm's), then waits up to 90 minutes on Apple's queue, then staples,
    # repacks the updater archive, verifies and stages. Those have to fit end
    # to end. At 120 a slow compile could eat the notary step's own budget and
    # GitHub would hard-kill the job -- no message, no submission id printed,
    # and the submission left alive in Apple's queue, which is how this account
    # accumulated unsettled ones. Raise this and `--timeout` together.
    timeout-minutes: 210
    permissions:
      contents: read
    outputs:
      dmg_filename: ${{ steps.stage.outputs.dmg_filename }}
      tarball_filename: ${{ steps.stage.outputs.tarball_filename }}
      sig_filename: ${{ steps.stage.outputs.sig_filename }}
      dmg_sha256: ${{ steps.stage.outputs.dmg_sha256 }}
      tarball_sha256: ${{ steps.stage.outputs.tarball_sha256 }}
      sig_sha256: ${{ steps.stage.outputs.sig_sha256 }}
    env:
      # An empty secret value is falsy in bash but truthy to Tauri (a
      # set-but-empty APPLE_CERTIFICATE is still treated as a certificate), so
      # gate on this boolean rather than letting `pnpm tauri build` discover
      # emptiness itself.
      APPLE_SIGNING_CONFIGURED: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Verify release checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          checkout_sha="$(git rev-parse HEAD)"
          tag_sha="$(gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "/repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          if [[ "$checkout_sha" != "$RELEASE_SHA" || "$tag_sha" != "$RELEASE_SHA" ]]; then
            echo "ERROR: release SHA $RELEASE_SHA, checkout $checkout_sha, and current tag $tag_sha differ."
            exit 1
          fi

      - name: Milestone-B 4b app version lockstep guard
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(jq -er '.version | strings' app/tauri.conf.json)"
          if [[ "v$APP_VERSION" != "$RELEASE_TAG" ]]; then
            echo "ERROR: Milestone-B 4b lockstep guard: app/tauri.conf.json version $APP_VERSION does not match release tag $RELEASE_TAG; stays red until phase 4c bumps the app version."
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master 2026-05-13
        with:
          toolchain: 1.95.0
          targets: aarch64-apple-darwin
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Download cloudflared sidecar
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/binaries
          curl -fsSL -o /tmp/cloudflared.tgz \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-darwin-arm64.tgz
          tar -xzf /tmp/cloudflared.tgz -C /tmp
          chmod 755 /tmp/cloudflared
          xattr -cr /tmp/cloudflared
          echo "CLOUDFLARED_BIN=/tmp/cloudflared" >> "$GITHUB_ENV"

      - name: Load Apple signing and notarization secrets
        if: env.APPLE_SIGNING_CONFIGURED == 'true'
        shell: bash
        env:
          SECRET_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          SECRET_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SECRET_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          SECRET_APPLE_ID: ${{ secrets.APPLE_ID }}
          SECRET_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          SECRET_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY; do
            var="SECRET_${name}"
            if [[ -z "${!var:-}" ]]; then
              echo "ERROR: APPLE_SIGNING_CONFIGURED is true but secret $name is empty." >&2
              exit 1
            fi
          done

          notarization_names=(APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID)
          notarization_set=0
          for name in "${notarization_names[@]}"; do
            var="SECRET_${name}"
            [[ -n "${!var:-}" ]] && notarization_set=$((notarization_set + 1))
          done
          if [[ "$notarization_set" -ne 0 && "$notarization_set" -ne 3 ]]; then
            for name in "${notarization_names[@]}"; do
              var="SECRET_${name}"
              if [[ -z "${!var:-}" ]]; then
                echo "ERROR: notarization secrets must be all set or all unset; $name is missing." >&2
                exit 1
              fi
            done
          fi

          # Every secret is checked, but only the three signing ones are exported.
          # Apple asks that a nested layout be notarized once, at the outermost
          # container, and tauri-bundler submits the .app on its own the moment
          # it can see APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID in the
          # environment (macos/app.rs notarize_auth). Withholding those three is
          # what makes `tauri build` sign the app and stop; the disk image is
          # then the only thing submitted. The steps that do talk to the notary
          # service take the three from `secrets` directly.
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            var="SECRET_${name}"
            value="${!var:-}"
            if [[ "$name" == "APPLE_CERTIFICATE" ]]; then
              value="$(tr -d '[:space:]' <<<"$value")"
            fi
            if [[ "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
              echo "ERROR: secret $name contains a line break." >&2
              exit 1
            fi
            case "$name" in
              APPLE_ID | APPLE_PASSWORD | APPLE_TEAM_ID) continue ;;
            esac
            if [[ -n "$value" ]]; then
              printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
            fi
          done

          if [[ "$notarization_set" -eq 3 ]]; then
            echo "APPLE_NOTARIZATION_CONFIGURED=true" >> "$GITHUB_ENV"
            echo "Developer ID signing + notarization"
          else
            echo "APPLE_NOTARIZATION_CONFIGURED=false" >> "$GITHUB_ENV"
            echo "Developer ID signing without notarization"
          fi

      - name: Build macOS desktop app bundle
        shell: bash
        env:
          CXXFLAGS: "-std=c++17"
          CLOUDFLARED_BIN: ${{ env.CLOUDFLARED_BIN }}
          # Ad-hoc sign ("-") when no Apple Developer cert is configured.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target aarch64-apple-darwin

      # Apple: "if you have an app inside an installer package on a disk image,
      # sign the app, sign the installer package, and sign the disk image, but
      # only notarize the disk image." The disk image is what a browser download
      # hands a new user, quarantine attribute and all, so it is also the thing
      # Gatekeeper assesses on the first double-click. One submission covers the
      # app nested inside it, and the ticket is stapled so that assessment needs
      # no network round trip.
      - name: Notarize and staple the DMG
        if: env.APPLE_NOTARIZATION_CONFIGURED == 'true'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          bundle_dir="$GITHUB_WORKSPACE/target/aarch64-apple-darwin/release/bundle"
          dmg="$(find "$bundle_dir/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          [[ -n "$dmg" && -f "$dmg" ]] || { echo "ERROR: no .dmg found under $bundle_dir/dmg." >&2; exit 1; }
          # 90m, not the job's full 120: the build ahead of this step has
          # already spent part of the budget, and a wait that outlives the job
          # is killed without printing the submission id. Apple's queue is
          # unpredictable enough that this timeout is reached in practice.
          set +e
          out="$(xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait --timeout 90m 2>&1)"
          rc=$?
          set -e
          echo "$out"
          # --wait prints a verdict but never a cause. Apple keeps the reasons
          # in the per-submission log alone, so read it on every verdict: a
          # rejected release then explains itself here instead of costing
          # another hour-long build to diagnose.
          sub_id="$(sed -n 's/^ *id: \([0-9a-f-]*\)$/\1/p' <<<"$out" | head -1)"
          if [[ -n "$sub_id" ]]; then
            echo "--- notarytool log for $sub_id ---"
            xcrun notarytool log "$sub_id" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" 2>&1 | head -200 || true
          fi
          if [[ "$rc" -ne 0 ]]; then
            echo "ERROR: notarytool exited $rc for the DMG." >&2
            # A timeout leaves the submission alive in Apple's queue. Name it,
            # because the fix is to wait on this id -- `xcrun notarytool wait
            # <id>` -- not to rerun the job, which would submit the same disk
            # image a second time and queue behind the first.
            if [[ -n "$sub_id" ]]; then
              echo "Submission $sub_id is still with Apple. Wait on that id rather than resubmitting." >&2
            fi
            exit 1
          fi
          grep -q 'status: Accepted' <<<"$out" || { echo "ERROR: DMG notarization was not Accepted." >&2; exit 1; }
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"

      # A .tar.gz cannot hold a stapled ticket, so Apple's rule for archives is
      # to staple each item you put inside one instead. The updater unpacks this
      # archive and swaps the app into place, so that app needs a ticket of its
      # own. The disk-image submission above already covers it: a ticket is a
      # list of code directory hashes, and the app inside that image is this
      # same app, so stapling here is a lookup rather than a second submission.
      # Tauri built the archive before any ticket existed, hence the rebuild.
      # Re-signing goes through the same helper the bundler itself uses
      # (tauri-cli signer/sign.rs calls sign_file), so the updater sees exactly
      # the signature format it expects.
      - name: Staple the app and rebuild the updater archive
        if: env.APPLE_NOTARIZATION_CONFIGURED == 'true'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          bundle_dir="$GITHUB_WORKSPACE/target/aarch64-apple-darwin/release/bundle"
          app="$(find "$bundle_dir/macos" -maxdepth 1 -type d -name '*.app' -print -quit)"
          [[ -n "$app" && -d "$app" ]] || { echo "ERROR: no .app bundle found under $bundle_dir/macos." >&2; exit 1; }
          archive="$app.tar.gz"
          [[ -f "$archive" ]] || { echo "ERROR: $archive is missing; the updater bundle did not build." >&2; exit 1; }
          [[ -s "$archive.sig" ]] || { echo "ERROR: $archive.sig is missing; Tauri did not sign the updater archive." >&2; exit 1; }
          before_sig="$(cat "$archive.sig")"

          xcrun stapler staple "$app"
          xcrun stapler validate "$app"

          # --no-mac-metadata keeps the AppleDouble "._*" entries out, matching
          # what the bundler's own tar writer produces today.
          rm -f "$archive" "$archive.sig"
          tar --no-mac-metadata -C "$(dirname "$app")" -czf "$archive" "$(basename "$app")"
          pnpm tauri signer sign "$archive"
          [[ -s "$archive.sig" ]] || { echo "ERROR: re-signing produced no $archive.sig." >&2; exit 1; }
          [[ "$(cat "$archive.sig")" != "$before_sig" ]] || { echo "ERROR: $archive.sig is unchanged; the rebuild did not take." >&2; exit 1; }

          # Unpack what the updater will unpack, and assert the app it finds is
          # the stapled one. A silently broken updater archive is the worst
          # failure this job could ship, so it fails here instead.
          unpacked="$RUNNER_TEMP/updater-archive-check"
          rm -rf "$unpacked"
          mkdir -p "$unpacked"
          tar -C "$unpacked" -xzf "$archive"
          unpacked_app="$(find "$unpacked" -maxdepth 1 -type d -name '*.app' -print -quit)"
          [[ -n "$unpacked_app" && -d "$unpacked_app" ]] || { echo "ERROR: the rebuilt archive has no .app at its root." >&2; exit 1; }
          codesign --verify --deep --strict "$unpacked_app"
          xcrun stapler validate "$unpacked_app"
          rm -rf "$unpacked"

      - name: Verify Apple signature and notarization
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${APPLE_SIGNING_CONFIGURED}" != "true" ]]; then
            echo "Apple signing not configured; bundle is ad-hoc signed (Gatekeeper will reject the DMG). See docs/code-signing.md."
            exit 0
          fi
          bundle_dir="$GITHUB_WORKSPACE/target/aarch64-apple-darwin/release/bundle"
          app="$(find "$bundle_dir/macos" -maxdepth 1 -type d -name '*.app' -print -quit)"
          [[ -n "$app" && -d "$app" ]] || { echo "ERROR: no .app bundle found under $bundle_dir/macos." >&2; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app"
          sign_info="$(codesign -dv --verbose=2 "$app" 2>&1)"
          grep -q 'Authority=Developer ID Application' <<<"$sign_info" || { echo "ERROR: app is not signed with a Developer ID Application certificate." >&2; exit 1; }
          if [[ "${APPLE_NOTARIZATION_CONFIGURED:-false}" == "true" ]]; then
            spctl --assess --type execute --verbose=2 "$app"
            xcrun stapler validate "$app"
            dmg="$(find "$bundle_dir/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
            [[ -n "$dmg" && -f "$dmg" ]] || { echo "ERROR: no .dmg found under $bundle_dir/dmg." >&2; exit 1; }
            xcrun stapler validate "$dmg"
            spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
            # The app the user drags out of the disk image is a copy made before
            # the ticket existed, so it carries no ticket of its own and
            # Gatekeeper resolves it against Apple instead. Assert that the
            # image really does hold a notarized app rather than assuming it.
            mount="$RUNNER_TEMP/dmg-assess"
            rm -rf "$mount"
            # hdiutil creates a missing mountpoint on current macOS, but the
            # runner image is older than the machine this was checked on, so
            # make it rather than depend on the version.
            mkdir -p "$mount"
            hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg"
            mounted_app="$(find "$mount" -maxdepth 1 -type d -name '*.app' -print -quit)"
            if [[ -z "$mounted_app" || ! -d "$mounted_app" ]]; then
              hdiutil detach "$mount" || true
              echo "ERROR: no .app inside $dmg." >&2
              exit 1
            fi
            assess="$(spctl --assess --type exec --verbose=2 "$mounted_app" 2>&1)" || {
              echo "$assess"; hdiutil detach "$mount" || true
              echo "ERROR: Gatekeeper rejected the app inside the disk image." >&2; exit 1; }
            echo "$assess"
            hdiutil detach "$mount"
            grep -q 'source=Notarized Developer ID' <<<"$assess" || {
              echo "ERROR: the app inside the disk image is not seen as notarized." >&2; exit 1; }
          else
            echo "Notarization not configured (APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID); the app is Developer ID signed but Gatekeeper still blocks the first launch. See docs/code-signing.md."
          fi

      - name: Stage app bundle assets and checksums
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(jq -er '.version | strings' app/tauri.conf.json)"
          bundle_dir="$GITHUB_WORKSPACE/target/aarch64-apple-darwin/release/bundle"
          dmg="$(find "$bundle_dir/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          tarball="$(find "$bundle_dir/macos" -maxdepth 1 -type f -name '*.app.tar.gz' -print -quit)"
          sig="${tarball}.sig"
          [[ -n "$dmg" && -f "$dmg" ]] || { echo "ERROR: Tauri did not emit a .dmg under $bundle_dir/dmg."; exit 1; }
          [[ -n "$tarball" && -f "$tarball" ]] || { echo "ERROR: Tauri did not emit an .app.tar.gz under $bundle_dir/macos."; exit 1; }
          [[ -f "$sig" ]] || { echo "ERROR: Tauri did not emit $sig."; exit 1; }

          staged="$RUNNER_TEMP/app-bundle-staging"
          rm -rf "$staged"
          mkdir -p "$staged"
          dmg_name="Wenlan_${APP_VERSION}_aarch64.dmg"
          tarball_name="Wenlan_aarch64.app.tar.gz"
          sig_name="${tarball_name}.sig"
          cp "$dmg" "$staged/$dmg_name"
          cp "$tarball" "$staged/$tarball_name"
          cp "$sig" "$staged/$sig_name"

          dmg_sha256="$(shasum -a 256 "$staged/$dmg_name" | awk '{print $1}')"
          tarball_sha256="$(shasum -a 256 "$staged/$tarball_name" | awk '{print $1}')"
          sig_sha256="$(shasum -a 256 "$staged/$sig_name" | awk '{print $1}')"
          echo "Tauri DMG: $dmg"
          echo "Tauri updater bundle: $tarball"
          echo "Tauri updater signature: $sig"
          echo "Staged checksums: $dmg_sha256 $tarball_sha256 $sig_sha256"
          {
            echo "dmg_filename=$dmg_name"
            echo "tarball_filename=$tarball_name"
            echo "sig_filename=$sig_name"
            echo "dmg_sha256=$dmg_sha256"
            echo "tarball_sha256=$tarball_sha256"
            echo "sig_sha256=$sig_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Upload macOS app bundle artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: app-bundle-${{ github.run_id }}
          path: ${{ runner.temp }}/app-bundle-staging
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
          overwrite: true

  # The Windows counterpart of app-bundle. Same shape, same guards; the setup
  # steps come from ci.yml's app-windows-bundle job, which is where they were
  # worked out. Unlike that job this one signs with the real updater key,
  # because what it produces is what users install and what the updater fetches.
  app-bundle-windows:
    name: Build Windows desktop app bundle
    needs: [resolve-promotion, bind-release-tag]
    runs-on: windows-2022
    # A job timeout starts when the JOB starts, not when the signing step does,
    # so budgeting only the SignPath wait would let a slow compile kill the job
    # before the action ever reaches its own limit -- the same trap the macOS
    # comment above describes. Measured on this repository's last four tag
    # releases (runs 33043452863, 33121699208, 33284603345, 33291555184) the
    # job took 38m21s to 39m00s end to end; in the most recent of those the
    # bundle build alone was 36m10s and the whole post-build tail -- stage, DLL
    # check, upload -- was 15s. So:
    #    40  measured pre-signing work
    #   +10  a 62 MB installer up to Actions, on to SignPath, and back down
    #   +90  the wait-for-completion-timeout-in-seconds: 5400 set below, which
    #        is waiting for a human approver, not for a machine
    #   + 5  replace, re-sign, stage, verify Authenticode
    #   +20  margin
    #   =165
    # Raise the wait and this together, and with them the exact value pinned in
    # scripts/release-workflow-contract.test.py.
    timeout-minutes: 165
    permissions:
      # The SignPath action's github-token reads this run's job details and
      # downloads the artifact the step before it uploaded; contents:read alone
      # does not allow either. An explicit permissions block sets every scope it
      # does not list to none, so this has to be spelled out.
      actions: read
      contents: read
    env:
      # TWO questions, because they have different answers and the gap between
      # them is where an unsigned installer ships green.
      #
      # SIGNPATH_CONFIGURED -- ARE the secrets here? Derived from all four, not
      # from the token alone. The token-only form was not a bypass (the
      # unconditional check below rejects any 1-to-3-of-4 combination before the
      # build starts) but it said something false: a reader saw a sentinel that
      # claimed to mean "SignPath is configured" while measuring one fifth of it.
      # A set-but-empty secret still reads as empty to `!= ''`, which is why this
      # is a boolean computed here rather than a bash test on the secret itself.
      #
      # SIGNPATH_REQUIRED -- MUST this build be signed? Nothing about the
      # secrets. It is true only in the upstream repository AND only once
      # signing has been switched on deliberately, and it is what turns
      # "SignPath is not configured" from a description of the world into a
      # failure. Without it, the day the Foundation accepts the application, a
      # repository whose secrets were never installed -- or were installed in
      # the wrong environment, or resolve as empty -- looks EXACTLY like this
      # one does today: zero of four, every signing step skipped, the original
      # unsigned installer staged, hashed, uploaded, and the job green. An
      # accepted-but-unwired repository would be indistinguishable, at the
      # release conclusion, from a pending one.
      #
      # `vars.` and not `secrets.`, deliberately, and it is the first Actions
      # variable in this repository. A secret's value cannot be read back by a
      # human or printed in a log, so a switch stored as a secret is a switch
      # nobody can audit; this one is a visible, single flip in the repository
      # settings, and signpath-status.yml reports on the day it is missing.
      # Comparing to the literal 'true' rather than testing emptiness means
      # `vars.SIGNPATH_ACTIVE` set to `false`, `0` or `no` reads as off instead
      # of as on.
      SIGNPATH_CONFIGURED: ${{ secrets.SIGNPATH_API_TOKEN != '' && secrets.SIGNPATH_ORGANIZATION_ID != '' && secrets.SIGNPATH_PROJECT_SLUG != '' && secrets.SIGNPATH_SIGNING_POLICY_SLUG != '' }}
      SIGNPATH_REQUIRED: ${{ github.repository == '7xuanlu/wenlan' && vars.SIGNPATH_ACTIVE == 'true' }}
    outputs:
      setup_filename: ${{ steps.stage.outputs.setup_filename }}
      sig_filename: ${{ steps.stage.outputs.sig_filename }}
      setup_sha256: ${{ steps.stage.outputs.setup_sha256 }}
      sig_sha256: ${{ steps.stage.outputs.sig_sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Verify release checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # Git Bash on Windows rewrites arguments that look like absolute POSIX
          # paths ("/repos/...") into filesystem paths, which broke this `gh api`
          # tag check in the v0.16.0 release run. Scoped to this step only:
          # job-wide it also breaks the pnpm shim, which relies on that
          # conversion to find its own install path.
          MSYS_NO_PATHCONV: "1"
        run: |
          set -euo pipefail
          checkout_sha="$(git rev-parse HEAD)"
          tag_sha="$(gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "/repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          if [[ "$checkout_sha" != "$RELEASE_SHA" || "$tag_sha" != "$RELEASE_SHA" ]]; then
            echo "ERROR: release SHA $RELEASE_SHA, checkout $checkout_sha, and current tag $tag_sha differ."
            exit 1
          fi

      - name: Milestone-B 4b app version lockstep guard
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(jq -er '.version | strings' app/tauri.conf.json)"
          if [[ "v$APP_VERSION" != "$RELEASE_TAG" ]]; then
            echo "ERROR: Milestone-B 4b lockstep guard: app/tauri.conf.json version $APP_VERSION does not match release tag $RELEASE_TAG."
            exit 1
          fi

      # Deliberately unguarded, and deliberately first. Every signing step below
      # carries `if: env.SIGNPATH_CONFIGURED`, so if this check carried it too it
      # would skip alongside them in exactly the configurations it exists to
      # reject, and a green run would publish an unsigned installer. This is the
      # one step that must run whatever the configuration is. It runs before the
      # ~40-minute bundle build so a misconfigured repository is told in seconds
      # rather than at the end.
      #
      # It answers two questions and they are not the same question:
      #
      #   1. ALL-OR-NOTHING. Any 1-to-3-of-4 combination is a repository where
      #      somebody began wiring SignPath and stopped, and it fails here.
      #   2. REQUIRED-BUT-ABSENT. Zero of four is correct behaviour TODAY -- the
      #      Foundation application is pending and every fork is in this state --
      #      and it becomes a critical hole the day the application is accepted,
      #      because an accepted repository whose secrets were never installed
      #      produces the identical green unsigned release. SIGNPATH_REQUIRED is
      #      what tells those two apart, and this step is where it bites.
      - name: Check SignPath configuration is all-or-nothing, and present when required
        shell: bash
        env:
          # Read here rather than branched on in `if:`, so the step runs in every
          # configuration and the decision is in the script the contract test can
          # execute. A step whose `if:` encodes the rule is a step that skips
          # whenever the rule is about to fire.
          SIGNPATH_REQUIRED: ${{ env.SIGNPATH_REQUIRED }}
          SECRET_SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          SECRET_SIGNPATH_PROJECT_SLUG: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          SECRET_SIGNPATH_SIGNING_POLICY_SLUG: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          SECRET_SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          # Optional to the signing action, but not optional as evidence -- see
          # the check on it below.
          SECRET_SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ secrets.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
        run: |
          set -euo pipefail
          names=(
            SIGNPATH_ORGANIZATION_ID
            SIGNPATH_PROJECT_SLUG
            SIGNPATH_SIGNING_POLICY_SLUG
            SIGNPATH_API_TOKEN
          )
          present=0
          for name in "${names[@]}"; do
            var="SECRET_${name}"
            if [[ -n "${!var:-}" ]]; then
              present=$((present + 1))
            fi
          done
          if [[ "$present" -ne 0 && "$present" -ne "${#names[@]}" ]]; then
            for name in "${names[@]}"; do
              var="SECRET_${name}"
              if [[ -z "${!var:-}" ]]; then
                echo "ERROR: SignPath secrets must be all set or all unset; $name is missing." >&2
              fi
            done
            exit 1
          fi
          # The artifact configuration slug is optional to the signing action --
          # unset selects the project's default configuration in the portal --
          # but it is not optional as evidence. Set on its own it means somebody
          # began wiring SignPath and stopped, and since this job keys on the
          # four required values, the release would otherwise go green and
          # publish an UNSIGNED installer. signpath-status.yml already reports
          # exactly this state as half-configured; without this check the two
          # shipping controls disagree about the same repository.
          if [[ "$present" -eq 0 && -n "${SECRET_SIGNPATH_ARTIFACT_CONFIGURATION_SLUG:-}" ]]; then
            echo "ERROR: SIGNPATH_ARTIFACT_CONFIGURATION_SLUG is set while none of the four required SignPath secrets are." >&2
            echo "       The optional slug on its own signs nothing. Set all four, or unset it." >&2
            exit 1
          fi
          # The sentinel and the count have to agree, or the guarded steps act on
          # a different answer than the one this step just printed.
          if [[ "$present" -eq "${#names[@]}" && "${SIGNPATH_CONFIGURED:-}" != "true" ]]; then
            echo "ERROR: all four SignPath secrets are set but SIGNPATH_CONFIGURED is '${SIGNPATH_CONFIGURED:-}'." >&2
            exit 1
          fi
          if [[ "$present" -eq 0 && "${SIGNPATH_CONFIGURED:-}" == "true" ]]; then
            echo "ERROR: SIGNPATH_CONFIGURED is true but no SignPath secret is set." >&2
            exit 1
          fi
          # THE LATCH. Everything above measures whether the secrets are HERE.
          # This asks whether they were supposed to be, and it is the only thing
          # in this job that can tell an intentionally unsigned release from a
          # repository that was meant to sign and silently did not.
          #
          # Ordered after the all-or-nothing check on purpose: a half-configured
          # repository gets the more specific message, naming the one secret it
          # is missing, rather than this one.
          if [[ "${SIGNPATH_REQUIRED:-}" == "true" && "$present" -ne "${#names[@]}" ]]; then
            echo "ERROR: this repository has switched SignPath signing ON (vars.SIGNPATH_ACTIVE)" >&2
            echo "       and the secrets it needs are not all readable from this job." >&2
            echo "" >&2
            for name in "${names[@]}"; do
              var="SECRET_${name}"
              if [[ -z "${!var:-}" ]]; then
                echo "       MISSING: $name" >&2
              else
                echo "       present: $name" >&2
              fi
            done
            echo "" >&2
            echo "       Every signing step in this job is guarded on SIGNPATH_CONFIGURED, so" >&2
            echo "       without this check the job would skip all five, stage and hash the" >&2
            echo "       ORIGINAL UNSIGNED installer, upload it, and finish green. Refusing" >&2
            echo "       instead: a release that was required to be signed will not publish" >&2
            echo "       an unsigned installer." >&2
            echo "" >&2
            echo "       If a secret is set but reads as empty here, check that it is on the" >&2
            echo "       repository rather than on an environment this job does not use, and" >&2
            echo "       that this workflow is running in ${GITHUB_REPOSITORY:-the upstream repository}." >&2
            echo "       To stand signing down deliberately, unset vars.SIGNPATH_ACTIVE." >&2
            exit 1
          fi

          if [[ "$present" -eq 0 ]]; then
            echo "SignPath is not configured. This release publishes an UNSIGNED Windows installer."
            echo "SIGNPATH_REQUIRED is '${SIGNPATH_REQUIRED:-false}', so that is the intended state:"
            echo "either this is a fork, or signing has not been switched on upstream yet."
            echo "This step measures the secrets and that switch, and nothing else. Whether"
            echo "SignPath Foundation has ACCEPTED the application is UNMEASURED here -- an"
            echo "accepted application whose secrets were never installed looks exactly like an"
            echo "application still pending. signpath-status.yml is what asks that question, and"
            echo "it runs on a schedule precisely so accepted-but-not-switched-on is noticed."
          else
            echo "SignPath is configured. The installer will be Authenticode-signed before staging."
            echo "SIGNPATH_REQUIRED is '${SIGNPATH_REQUIRED:-false}'."
          fi

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master 2026-05-13
        with:
          toolchain: 1.95.0
          targets: x86_64-pc-windows-msvc
      - name: Stabilize Windows Rust cache toolchain inputs
        shell: bash
        run: bash scripts/stabilize-rust-cache-toolchains.sh
      - name: Configure rust-lld linker
        shell: pwsh
        run: |
          $sysroot = (rustc --print sysroot).Trim()
          $lld = Join-Path $sysroot "lib/rustlib/x86_64-pc-windows-msvc/bin/rust-lld.exe"
          if (-not (Test-Path $lld)) {
            throw "rust-lld.exe missing at $lld"
          }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$lld" |
            Out-File -FilePath $env:GITHUB_ENV -Append
          "RUSTFLAGS=-C linker=$lld -C linker-flavor=lld-link" |
            Out-File -FilePath $env:GITHUB_ENV -Append
      # Git Bash's msys perl cannot load Locale::Maketext::Simple, so vendored
      # OpenSSL's ./Configure dies before it starts. Point openssl-src at a
      # native perl instead.
      - name: Select native Perl for vendored OpenSSL
        shell: pwsh
        run: |
          $nativePerl = $null
          foreach ($candidate in Get-Command perl.exe -CommandType Application -All) {
            if ($candidate.Source -match '[\\/]Git[\\/]') {
              continue
            }
            & $candidate.Source "-MLocale::Maketext::Simple" "-e" "1"
            if ($LASTEXITCODE -eq 0) {
              $nativePerl = $candidate.Source
              break
            }
          }
          if (-not $nativePerl) {
            throw "No native Perl can load Locale::Maketext::Simple"
          }
          "OPENSSL_SRC_PERL=$nativePerl" |
            Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "OPENSSL_SRC_PERL=$nativePerl"
      # libsql does not bundle SQLite on Windows; vcpkg ships it prebuilt.
      - name: Install sqlite3
        shell: pwsh
        run: |
          vcpkg install sqlite3:x64-windows-static-md
          "LIB=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static-md\lib;$env:LIB" |
            Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Set up Vulkan SDK
        shell: pwsh
        run: |
          & scripts/setup-vulkan-sdk-windows.ps1
      - name: Configure MSVC Ninja
        shell: pwsh
        run: |
          & scripts/setup-msvc-ninja-windows.ps1
      # Into app/binaries beside the sidecars, because that is where
      # app/tauri.windows.conf.json bundles them from.
      - name: Stage ONNX Runtime and the Vulkan loader
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dllDir = "app/binaries"
          & scripts/stage-onnxruntime-windows.ps1 -DestinationDirectory $dllDir
          & scripts/stage-vulkan-loader-windows.ps1 -DestinationDirectory $dllDir
          Get-ChildItem $dllDir | Format-Table Name, Length
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # No explicit daemon build step: tauri.conf.json's beforeBuildCommand runs
      # prepare-sidecars.sh, which compiles the daemon, CLI, and MCP for
      # TAURI_ENV_TARGET_TRIPLE itself. Adding one here would also trip the
      # contract test's rule that a tag release never recompiles on its own.
      - name: Download cloudflared sidecar
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/cloudflared.exe" \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe
          chmod 755 "$RUNNER_TEMP/cloudflared.exe"
          echo "CLOUDFLARED_BIN=$RUNNER_TEMP/cloudflared.exe" >> "$GITHUB_ENV"

      - name: Build Windows desktop app bundle
        shell: bash
        env:
          CLOUDFLARED_BIN: ${{ env.CLOUDFLARED_BIN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target x86_64-pc-windows-msvc

      # ---- Authenticode signing, SignPath Foundation ----------------------
      # Everything from here to the Authenticode assertion is guarded on
      # SIGNPATH_CONFIGURED, so a fork and this repository (whose Foundation
      # application is still pending) both build green with no SignPath secret
      # present. The unguarded all-or-nothing check near the top of this job is
      # what stops a half-configured repository from taking that same silent
      # path.
      #
      # Signing has to land BEFORE *Stage app bundle assets and checksums*: that
      # step copies and hashes the installer immediately, and promote-app-assets
      # rechecks those exact digests. Signing after it would publish either
      # unsigned bytes or a digest that no longer matches the file.
      - name: Upload the unsigned installer for SignPath
        id: unsigned-installer
        if: env.SIGNPATH_CONFIGURED == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unsigned-windows-installer-${{ github.run_id }}
          # A glob that matches exactly one file, so the artifact ZIP holds that
          # installer at its root. That root is what the SignPath artifact
          # configuration has to describe, and it is why this upload keeps
          # `archive` at its default rather than using `archive: false`: raw
          # mode ignores `name:` and derives the artifact name from the
          # basename, which makes a run-attempt-scoped name useless for
          # collision avoidance and pairs badly with `overwrite: true`.
          path: target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          # The installer is already compressed; recompressing 62 MB buys
          # nothing, exactly as in the staged upload at the end of this job.
          compression-level: 0
          # A re-run of this job would otherwise collide with the previous
          # attempt's artifact of the same name.
          overwrite: true
          retention-days: 1
          if-no-files-found: error

      # Pinned by SHA, and listed in EXPECTED_NODE24_ACTIONS in
      # scripts/release-workflow-contract.test.py -- that allowlist silently
      # skips any action it does not know, so an unpinned SignPath reference
      # would otherwise pass unnoticed.
      - name: Submit the installer to SignPath for signing
        id: signpath-request
        if: env.SIGNPATH_CONFIGURED == 'true'
        uses: SignPath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2.3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          # Optional in the action's own manifest: unset selects the project's
          # default artifact configuration in the portal, which must describe a
          # ZIP root to match the upload above.
          artifact-configuration-slug: ${{ secrets.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          github-token: ${{ github.token }}
          wait-for-completion: true
          # 600 by default, and this is waiting for a person: the Foundation's
          # terms require a team member to approve each signing request. 5400
          # matches the macOS notary wait and is budgeted into this job's
          # timeout-minutes above.
          wait-for-completion-timeout-in-seconds: "5400"
          # WITHOUT THIS THE ACTION DOWNLOADS NOTHING AND SAYS NOTHING. The
          # input is optional and its absence is silent -- the manifest reads
          # "If not specified, the task will not download the signed artifact
          # from SignPath" -- so the job would go green, staging would find the
          # original unsigned installer exactly where it left it, and the
          # release would ship unsigned.
          output-artifact-directory: ${{ runner.temp }}/signpath-signed
          # Left at its default on purpose: SignPath returns the ZIP that was
          # submitted, and false makes the action extract it into the directory
          # above, which is where the replacement step expects a bare
          # *-setup.exe.
          skip-decompress: "false"

      - name: Replace the unsigned installer with the signed one
        if: env.SIGNPATH_CONFIGURED == 'true'
        shell: pwsh
        env:
          SIGNED_DIR: ${{ runner.temp }}/signpath-signed
        run: |
          $ErrorActionPreference = "Stop"
          $nsisDir = "target/x86_64-pc-windows-msvc/release/bundle/nsis"

          if (-not (Test-Path -LiteralPath $env:SIGNED_DIR)) {
            throw "SignPath returned nothing to $env:SIGNED_DIR. output-artifact-directory is the input that makes the download happen at all; without a downloaded file this release would ship the unsigned installer."
          }

          # Cardinality first, on both sides. `find -print -quit` in the staging
          # step takes whichever *-setup.exe it meets first, so more than one
          # here is not a warning, it is a coin toss over what gets published.
          $unsigned = @(Get-ChildItem -LiteralPath $nsisDir -Filter '*-setup.exe' -File)
          if ($unsigned.Count -ne 1) {
            throw "expected exactly one *-setup.exe under $nsisDir, found $($unsigned.Count)"
          }
          $signed = @(Get-ChildItem -LiteralPath $env:SIGNED_DIR -Filter '*-setup.exe' -File -Recurse)
          if ($signed.Count -ne 1) {
            throw "expected exactly one signed *-setup.exe under $env:SIGNED_DIR, found $($signed.Count)"
          }

          # Then the filename, because *Stage app bundle assets and checksums*
          # looks the installer up by shape and the updater reaches it by the
          # URL latest.json spells out.
          if ($signed[0].Name -ne $unsigned[0].Name) {
            throw "SignPath returned '$($signed[0].Name)' but the build produced '$($unsigned[0].Name)'"
          }

          # Content, not mtime. An mtime comparison is unsound in both
          # directions here, because ZIP extraction restores the archive entry's
          # own timestamp -- a correctly signed installer can come back older
          # than the file submitted, and an unrelated stale file can come back
          # newer. A SHA-256 inequality is the assertion that actually holds,
          # with Authenticode below as the authenticity gate.
          # docs/code-signing.md step 2 says the same thing.
          $before = (Get-FileHash -Algorithm SHA256 -LiteralPath $unsigned[0].FullName).Hash
          $after = (Get-FileHash -Algorithm SHA256 -LiteralPath $signed[0].FullName).Hash
          if ($before -eq $after) {
            throw "the file SignPath returned is byte-identical to the one submitted ($before); nothing was signed"
          }

          Copy-Item -LiteralPath $signed[0].FullName -Destination $unsigned[0].FullName -Force
          $installed = (Get-FileHash -Algorithm SHA256 -LiteralPath $unsigned[0].FullName).Hash
          if ($installed -ne $after) {
            throw "replacement did not take: $($unsigned[0].FullName) hashes $installed, expected $after"
          }
          Write-Host "unsigned $before"
          Write-Host "signed   $after"
          Write-Host "replaced $($unsigned[0].FullName)"

      # The .sig beside the installer was computed over the UNSIGNED bytes, so
      # Authenticode signing invalidates it and the updater would reject the
      # download. This is the same repair the macOS path makes after stapling.
      # TAURI_SIGNING_PRIVATE_KEY and its password are `env:` on the bundle
      # build step alone, so this step needs its own copy of both or it cannot
      # sign at all. Nothing may touch the installer's bytes after this point;
      # regenerating the sidecar .sig does not disturb its Authenticode
      # signature.
      - name: Regenerate the updater signature over the signed installer
        if: env.SIGNPATH_CONFIGURED == 'true'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          nsis_dir="target/x86_64-pc-windows-msvc/release/bundle/nsis"
          setup="$(find "$nsis_dir" -maxdepth 1 -type f -name '*-setup.exe' -print -quit)"
          [[ -n "$setup" && -f "$setup" ]] || { echo "ERROR: no *-setup.exe under $nsis_dir to re-sign." >&2; exit 1; }
          sig="${setup}.sig"
          [[ -s "$sig" ]] || { echo "ERROR: $sig is missing; the bundle build did not sign the installer." >&2; exit 1; }
          before_sig="$(cat "$sig")"

          rm -f "$sig"
          pnpm tauri signer sign "$setup"
          [[ -s "$sig" ]] || { echo "ERROR: re-signing produced no $sig." >&2; exit 1; }
          [[ "$(cat "$sig")" != "$before_sig" ]] || { echo "ERROR: $sig is unchanged; it still covers the unsigned bytes." >&2; exit 1; }
          echo "Regenerated $sig over the Authenticode-signed installer."

      # Staging runs before verification on purpose. Verifying the bundle
      # directory and then staging from it independently would let the two steps
      # pick different files if more than one setup.exe ever sits there; this way
      # the bytes that get verified are the exact bytes that get uploaded.
      - name: Stage app bundle assets and checksums
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(jq -er '.version | strings' app/tauri.conf.json)"
          # Relative, like the neighbouring pwsh steps: $GITHUB_WORKSPACE is a
          # backslash path on Windows and Git Bash's msys conversion of a mixed
          # separator string is not worth depending on.
          nsis_dir="target/x86_64-pc-windows-msvc/release/bundle/nsis"
          setup="$(find "$nsis_dir" -maxdepth 1 -type f -name '*-setup.exe' -print -quit)"
          sig="${setup}.sig"
          [[ -n "$setup" && -f "$setup" ]] || { echo "ERROR: Tauri did not emit a -setup.exe under $nsis_dir."; exit 1; }
          [[ -f "$sig" ]] || { echo "ERROR: Tauri did not emit $sig."; exit 1; }

          staged="$RUNNER_TEMP/app-bundle-windows-staging"
          rm -rf "$staged"
          mkdir -p "$staged"
          # Version in the name because this is also the human download; the
          # updater reaches it by the URL latest.json spells out, not by shape.
          setup_name="Wenlan_${APP_VERSION}_x64-setup.exe"
          sig_name="${setup_name}.sig"
          cp "$setup" "$staged/$setup_name"
          cp "$sig" "$staged/$sig_name"

          # Read via stdin: $RUNNER_TEMP is a backslash path on Windows, and
          # GNU sha256sum escapes such filenames by prefixing the digest with
          # a backslash ("\30c5..."), which then fails the byte-exact match in
          # promote-app-assets (seen on the fourth v0.16.0 recovery run).
          setup_sha256="$(sha256sum < "$staged/$setup_name" | awk '{print $1}')"
          sig_sha256="$(sha256sum < "$staged/$sig_name" | awk '{print $1}')"
          [[ "$setup_sha256" =~ ^[0-9a-f]{64}$ && "$sig_sha256" =~ ^[0-9a-f]{64}$ ]] || {
            echo "ERROR: staged checksums are not canonical hex: $setup_sha256 $sig_sha256"; exit 1; }
          echo "Tauri NSIS installer: $setup"
          echo "Tauri updater signature: $sig"
          echo "Staged checksums: $setup_sha256 $sig_sha256"
          {
            echo "setup_filename=$setup_name"
            echo "sig_filename=$sig_name"
            echo "setup_sha256=$setup_sha256"
            echo "sig_sha256=$sig_sha256"
          } >> "$GITHUB_OUTPUT"

      # Pointed at the STAGED installer -- the exact bytes that get uploaded and
      # whose digest promote-app-assets rechecks -- rather than at the bundle
      # directory, so this cannot pass against a different file than the one
      # that ships. A silently skipped download (see output-artifact-directory
      # above) leaves an unsigned installer in place, and Status would be
      # NotSigned here; a signature from anyone else fails the subject check.
      - name: Verify the installer carries a valid SignPath signature
        if: env.SIGNPATH_CONFIGURED == 'true'
        shell: pwsh
        env:
          STAGED_SETUP: ${{ runner.temp }}/app-bundle-windows-staging/${{ steps.stage.outputs.setup_filename }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path -LiteralPath $env:STAGED_SETUP)) {
            throw "staged installer missing at $env:STAGED_SETUP"
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $env:STAGED_SETUP
          Write-Host "Status: $($signature.Status)"
          if ($signature.Status -ne 'Valid') {
            throw "Authenticode status is '$($signature.Status)', expected 'Valid'. $($signature.StatusMessage)"
          }
          $certificate = $signature.SignerCertificate
          if ($null -eq $certificate) {
            throw "Authenticode reported Valid with no signer certificate"
          }
          # SignerCertificate.Subject is a full distinguished name, so a raw
          # string comparison against the bare publisher name is either always
          # false or a substring match that a hostile CN could satisfy. Ask the
          # certificate for the parsed common name instead.
          $publisher = $certificate.GetNameInfo(
            [System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName,
            $false)
          # Printed BEFORE the comparison and never conditionally, because on the
          # first real signed build these three lines are the only record of what
          # SignPath Foundation's certificate actually says. Nobody here has seen
          # it: the application is pending, so every string this step compares
          # against is taken from the Foundation's published terms rather than
          # from a certificate anyone has held. A run that FAILS the comparison
          # must still leave the exact values behind, or diagnosing it means
          # cutting another release to look.
          #
          # TODO(after the first signed release): read Subject and Thumbprint out
          # of that run's log and pin them here -- the full distinguished name
          # instead of the simple name, and the thumbprint as a second,
          # independent witness. Both are written down below for exactly that.
          # Do not invent either value in advance; a pinned string nobody has
          # verified is a gate that fails the first real build for the wrong
          # reason.
          Write-Host "Publisher:  $publisher"
          Write-Host "Subject:    $($certificate.Subject)"
          Write-Host "Issuer:     $($certificate.Issuer)"
          Write-Host "Thumbprint: $($certificate.Thumbprint)"
          # -cne, not -ne. PowerShell's -ne is CASE-INSENSITIVE, so `signpath
          # foundation` and `SIGNPATH FOUNDATION` both passed a check written to
          # assert one exact publisher name. A certificate is an identity
          # document; matching it loosely is how a different issuer with a
          # similarly-cased common name gets waved through.
          #
          # What this still does NOT establish, said plainly rather than implied:
          # SimpleName is the common name alone, so a DIFFERENT full
          # distinguished name carrying the same common name passes here. Closing
          # that needs the real Subject, which is what the TODO above is for.
          if ($publisher -cne 'SignPath Foundation') {
            throw "installer publisher is '$publisher', expected 'SignPath Foundation'"
          }
          Write-Host "PASS $env:STAGED_SETUP is signed by SignPath Foundation"

      # The same unpack-and-look check ci.yml's app-windows-bundle runs, pointed
      # at the staged installer. A release must never ship an installer that
      # omits what the daemon dynamically loads, so this gate lives on both paths
      # rather than being trusted from a CI run against a different commit.
      - name: Verify the runtime DLLs ship inside the installer
        shell: pwsh
        env:
          STAGED_SETUP: ${{ runner.temp }}/app-bundle-windows-staging/${{ steps.stage.outputs.setup_filename }}
        run: |
          $ErrorActionPreference = "Stop"
          $required = @("onnxruntime.dll", "vulkan-1.dll", "VulkanRT-License.txt")
          $failed = $false

          if (-not (Test-Path -LiteralPath $env:STAGED_SETUP)) {
            throw "staged installer missing at $env:STAGED_SETUP"
          }
          $listing = & 7z l -ba -- $env:STAGED_SETUP
          if ($LASTEXITCODE -ne 0) { throw "7z could not read $env:STAGED_SETUP" }
          foreach ($name in $required) {
            # $PLUGINSDIR is NSIS's scratch directory, deleted when the installer
            # exits. A name that only appears there is not a file the app ships,
            # so it must not count as a pass.
            $hit = $listing |
              Where-Object { $_ -match [regex]::Escape($name) -and $_ -notmatch '\$PLUGINSDIR' } |
              Select-Object -First 1
            if ($hit) {
              Write-Host "PASS $name -> $($hit.Trim())"
            } else {
              Write-Host "FAIL $name is not installed by the installer"
              $failed = $true
            }
          }
          if ($failed) {
            throw "the Windows installer is missing runtime files the daemon needs"
          }

      - name: Upload Windows app bundle artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: app-bundle-windows-${{ github.run_id }}
          path: ${{ runner.temp }}/app-bundle-windows-staging
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
          overwrite: true

  promote-assets:
    name: Promote exact validated release assets
    needs: [resolve-promotion, bind-release-tag, prepare-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      # Promotion tooling is control plane, not product: check out the same ref
      # resolve-promotion uses so both run one promotion resolver. The promoted
      # bytes come from the validated artifact and are verified against the
      # closed receipt by size and SHA-256, never from this checkout.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-promotion-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/promotion-plan
      - name: Download exact validated wrapper once
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release-promotion.py download-assets \
            --repository "$GITHUB_REPOSITORY" \
            --plan "$RUNNER_TEMP/promotion-plan/release-promotion-plan.json" \
            --output-dir "$RUNNER_TEMP/promoted-assets"
      - name: Upload without clobbering existing release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing="$RUNNER_TEMP/existing-release-assets"
          mkdir -p "$existing"
          for asset in "$RUNNER_TEMP"/promoted-assets/*; do
            tag_sha="$(gh api --method GET \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "/repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
            if [[ "$tag_sha" != "$RELEASE_SHA" ]]; then
              echo "ERROR: $RELEASE_TAG moved from release SHA $RELEASE_SHA to $tag_sha."
              exit 1
            fi
            name="$(basename "$asset")"
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets[].name' | grep -Fxq "$name"; then
              gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
                --pattern "$name" --dir "$existing"
              cmp "$asset" "$existing/$name" || {
                echo "Existing release asset $name differs; refusing to clobber."
                exit 1
              }
              echo "$name already exists with identical bytes."
            else
              gh release upload "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY"
            fi
          done
      - name: Publish exact Homebrew inputs for this run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: homebrew-artifacts
          path: |
            ${{ runner.temp }}/promoted-assets/wenlan-darwin-arm64.tar.gz
            ${{ runner.temp }}/promoted-assets/wenlan-mcp-darwin-arm64.tar.gz
          retention-days: 1
          if-no-files-found: error
          # Internal retry locator. The uploaded archives are still the exact
          # receipt-validated bytes, and every rerun creates a fresh artifact ID.
          overwrite: true
      # upload-artifact roots the archive at the common ancestor of its paths,
      # so listing promoted-assets/ and promotion-plan/ together nests both
      # under the runner temp root while the Docker job reads them flat. Stage
      # one directory so the producer and the consumer agree on the layout.
      - name: Stage exact Docker runtime inputs
        run: |
          set -euo pipefail
          staged="$RUNNER_TEMP/docker-runtime-staging"
          mkdir -p "$staged"
          cp "$RUNNER_TEMP/promoted-assets/wenlan-linux-x64.tar.gz" "$staged/"
          cp "$RUNNER_TEMP/promoted-assets/wenlan-linux-arm64.tar.gz" "$staged/"
          cp "$RUNNER_TEMP/promotion-plan/release-promotion-plan.json" "$staged/"
      - name: Publish exact Docker runtime inputs for this run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docker-runtime-inputs
          path: ${{ runner.temp }}/docker-runtime-staging
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
          # Internal retry locator; Docker revalidates the receipt and archive
          # hashes before it executes the copied server binary.
          overwrite: true

  promote-app-assets:
    name: Promote the desktop app assets
    # Split out of promote-assets deliberately. Both jobs upload to the same
    # release, but only this one waits on the desktop builds, so a failed
    # Windows bundle no longer skips the CLI tarballs, Docker, npm, crates and
    # Homebrew along with it. Nothing ships quietly missing a platform:
    # finalize-release needs this job, so a release whose app assets did not
    # land stays a prerelease and never becomes `releases/latest`.
    needs: [resolve-promotion, bind-release-tag, prepare-release, app-bundle, app-bundle-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download macOS app bundle artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: app-bundle-${{ github.run_id }}
          path: ${{ runner.temp }}/app-bundle
      - name: Download Windows app bundle artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: app-bundle-windows-${{ github.run_id }}
          path: ${{ runner.temp }}/app-bundle-windows
      - name: Verify app bundle bytes before promotion
        shell: bash
        run: |
          set -euo pipefail
          verify_sha256() {
            local dir="$1" name="$2" expected="$3" actual path
            path="$dir/$name"
            [[ -f "$path" ]] || { echo "ERROR: missing app bundle artifact $name."; exit 1; }
            actual="$(sha256sum "$path" | awk '{print $1}')"
            if [[ "$actual" != "$expected" ]]; then
              echo "ERROR: app bundle asset $name SHA-256 mismatch: expected $expected, got $actual."
              exit 1
            fi
            echo "$name: $actual"
          }
          mac="$RUNNER_TEMP/app-bundle"
          win="$RUNNER_TEMP/app-bundle-windows"
          verify_sha256 "$mac" "${{ needs.app-bundle.outputs.dmg_filename }}" "${{ needs.app-bundle.outputs.dmg_sha256 }}"
          verify_sha256 "$mac" "${{ needs.app-bundle.outputs.tarball_filename }}" "${{ needs.app-bundle.outputs.tarball_sha256 }}"
          verify_sha256 "$mac" "${{ needs.app-bundle.outputs.sig_filename }}" "${{ needs.app-bundle.outputs.sig_sha256 }}"
          verify_sha256 "$win" "${{ needs.app-bundle-windows.outputs.setup_filename }}" "${{ needs.app-bundle-windows.outputs.setup_sha256 }}"
          verify_sha256 "$win" "${{ needs.app-bundle-windows.outputs.sig_filename }}" "${{ needs.app-bundle-windows.outputs.sig_sha256 }}"
      - name: Upload desktop app assets and updater metadata without clobbering
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          existing="$RUNNER_TEMP/existing-app-release-assets"
          mkdir -p "$existing"

          upload_without_clobber() {
            local asset="$1" name tag_sha
            name="$(basename "$asset")"
            tag_sha="$(gh api --method GET \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "/repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
            if [[ "$tag_sha" != "$RELEASE_SHA" ]]; then
              echo "ERROR: $RELEASE_TAG moved from release SHA $RELEASE_SHA to $tag_sha."
              exit 1
            fi
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets[].name' | grep -Fxq "$name"; then
              gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
                --pattern "$name" --dir "$existing"
              cmp "$asset" "$existing/$name" || {
                echo "Existing release asset $name differs; refusing to clobber."
                exit 1
              }
              echo "$name already exists with identical bytes."
            else
              gh release upload "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY"
            fi
          }

          upload_without_clobber "$RUNNER_TEMP/app-bundle/${{ needs.app-bundle.outputs.dmg_filename }}"
          upload_without_clobber "$RUNNER_TEMP/app-bundle/${{ needs.app-bundle.outputs.tarball_filename }}"
          upload_without_clobber "$RUNNER_TEMP/app-bundle/${{ needs.app-bundle.outputs.sig_filename }}"
          upload_without_clobber "$RUNNER_TEMP/app-bundle-windows/${{ needs.app-bundle-windows.outputs.setup_filename }}"
          upload_without_clobber "$RUNNER_TEMP/app-bundle-windows/${{ needs.app-bundle-windows.outputs.sig_filename }}"

          # Installed clients still read the OLD repo endpoint until the phase-5 cutover;
          # this file must exist on the unified release BEFORE that cutover.
          #
          # Platform keys are what tauri-plugin-updater asks for: `{os}-{arch}`,
          # with an installer-suffixed key tried first and this one as the
          # fallback. On Windows the NSIS setup .exe is itself the update
          # payload, so the human download and the updater URL are one file.
          version="${RELEASE_TAG#v}"
          notes="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq '.body')"
          pub_date="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_SHA" --jq '.commit.committer.date')"
          signature="$(cat "$RUNNER_TEMP/app-bundle/${{ needs.app-bundle.outputs.sig_filename }}")"
          tarball_name="${{ needs.app-bundle.outputs.tarball_filename }}"
          win_signature="$(cat "$RUNNER_TEMP/app-bundle-windows/${{ needs.app-bundle-windows.outputs.sig_filename }}")"
          win_setup_name="${{ needs.app-bundle-windows.outputs.setup_filename }}"
          jq -n \
            --arg version "$version" \
            --arg notes "$notes" \
            --arg pub_date "$pub_date" \
            --arg signature "$signature" \
            --arg url "https://github.com/7xuanlu/wenlan/releases/download/$RELEASE_TAG/$tarball_name" \
            --arg win_signature "$win_signature" \
            --arg win_url "https://github.com/7xuanlu/wenlan/releases/download/$RELEASE_TAG/$win_setup_name" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "darwin-aarch64": {signature: $signature, url: $url},
                "darwin-aarch64-app": {signature: $signature, url: $url},
                "windows-x86_64": {signature: $win_signature, url: $win_url}
              }
            }' > "$RUNNER_TEMP/app-bundle/latest.json"
          upload_without_clobber "$RUNNER_TEMP/app-bundle/latest.json"

  docker:
    name: Verify & Push Runtime Image (${{ matrix.platform }})
    # Package the exact observer-validated server bytes. The semantic smoke
    # runs before registry login, so candidate code never executes with the
    # GHCR write credential in its environment.
    needs: [promote-assets, bind-release-tag]
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 12
    permissions:
      actions: read
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-24.04
            tag-suffix: amd64
            target: x86_64-unknown-linux-gnu
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm
            tag-suffix: arm64
            target: aarch64-unknown-linux-gnu
    steps:
      # This checkout supplies only tooling — the runtime Dockerfile and the
      # verifier. The bytes that reach the image come from the validated
      # artifact and are checked against the closed receipt by size and
      # SHA-256, so packaging is control plane exactly like promotion is.
      # Pinning it to the release commit would strand image fixes behind the
      # very release that needs them, which is how v0.15.4 shipped no image.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: docker-runtime-inputs
          path: ${{ runner.temp }}/docker-runtime-inputs
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      # Runtime image builds are not byte-reproducible, so a recovery dispatch
      # that rebuilt the images would produce new digests and docker-manifest
      # would then refuse to touch the already-published `$IMG:$TAG` (which is
      # exactly what happened on the second v0.16.0 recovery run). If the
      # release tag image already exists it was created only by this same
      # fail-closed job, so reuse its per-architecture digest as this run's
      # receipt and skip the rebuild/push. Anonymous inspect: no credential is
      # involved before the tag check below.
      - name: Reuse an already-published release image for this architecture
        id: existing
        env:
          IMG: ghcr.io/7xuanlu/wenlan-server
          ARCH: ${{ matrix.tag-suffix }}
          DIGEST_FILE: ${{ runner.temp }}/docker-image-digest-${{ matrix.tag-suffix }}.txt
          EVIDENCE_FILE: ${{ runner.temp }}/runtime-image-evidence-${{ matrix.tag-suffix }}.json
        run: |
          set -euo pipefail
          if ! raw="$(docker buildx imagetools inspect "$IMG:$RELEASE_TAG" --raw 2>/dev/null)"; then
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            echo "$IMG:$RELEASE_TAG is not published yet; building."
            exit 0
          fi
          digest="$(jq -er --arg arch "$ARCH" \
            '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest]
             | if length == 1 then .[0] else error("expected one manifest for " + $arch) end' <<<"$raw")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s@%s\n' "$IMG" "$digest" > "$DIGEST_FILE"
          jq -n --arg image "$IMG:$RELEASE_TAG" --arg digest "$digest" --arg run "$GITHUB_RUN_ID" \
            '{reused_published_image: $image, digest: $digest, run_id: $run}' > "$EVIDENCE_FILE"
          echo "reuse=true" >> "$GITHUB_OUTPUT"
          echo "Reusing published $IMG:$RELEASE_TAG ($ARCH) at $digest; skipping rebuild."
      - name: Revalidate bytes, build runtime-only image, and smoke
        if: steps.existing.outputs.reuse != 'true'
        env:
          LOCAL_IMAGE: ghcr.io/7xuanlu/wenlan-server:staging-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.tag-suffix }}
        run: |
          set -euo pipefail
          jq -e '.receipt' \
            "$RUNNER_TEMP/docker-runtime-inputs/release-promotion-plan.json" \
            > "$RUNNER_TEMP/docker-runtime-inputs/closed-receipt.json"
          python3 scripts/verify-release-runtime-image.py \
            --receipt "$RUNNER_TEMP/docker-runtime-inputs/closed-receipt.json" \
            --assets-dir "$RUNNER_TEMP/docker-runtime-inputs" \
            --target "${{ matrix.target }}" \
            --image "$LOCAL_IMAGE" \
            --dockerfile docker/Dockerfile.release-runtime \
            --output "$RUNNER_TEMP/runtime-image-evidence-${{ matrix.tag-suffix }}.json"
      - name: Require immutable release tag before registry credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag_sha="$(gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "/repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          if [[ "$tag_sha" != "$RELEASE_SHA" ]]; then
            echo "ERROR: $RELEASE_TAG moved from release SHA $RELEASE_SHA to $tag_sha."
            exit 1
          fi
      # No untrusted binary runs after this point.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: steps.existing.outputs.reuse != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push content-scoped staging image and record registry digest
        if: steps.existing.outputs.reuse != 'true'
        env:
          LOCAL_IMAGE: ghcr.io/7xuanlu/wenlan-server:staging-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.tag-suffix }}
          DIGEST_FILE: ${{ runner.temp }}/docker-image-digest-${{ matrix.tag-suffix }}.txt
        run: |
          set -euo pipefail
          push_log="$RUNNER_TEMP/docker-push-${{ matrix.tag-suffix }}.log"
          docker push "$LOCAL_IMAGE" 2>&1 | tee "$push_log"
          digest="$(sed -nE 's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' "$push_log" | tail -1)"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Registry did not return a canonical image digest."
            exit 1
          fi
          printf '%s@%s\n' "${LOCAL_IMAGE%:*}" "$digest" > "$DIGEST_FILE"
          docker buildx imagetools inspect "$(cat "$DIGEST_FILE")" >/dev/null
      - name: Publish immutable image digest receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docker-image-digest-${{ matrix.tag-suffix }}
          path: |
            ${{ runner.temp }}/docker-image-digest-${{ matrix.tag-suffix }}.txt
            ${{ runner.temp }}/runtime-image-evidence-${{ matrix.tag-suffix }}.json
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
          # One stable locator per architecture lets a failed matrix leg be
          # retried without discarding the successful leg. Registry digests are
          # re-inspected before any public manifest is created.
          overwrite: true

  docker-manifest:
    name: Combine Docker Manifest (multi-arch)
    # Public aliases are promotion outputs. Consume registry digests rather
    # than mutable staging tags and expose them only after every channel passes.
    needs: [docker, promote-assets, publish-crates, publish-npm, update-homebrew, bind-release-tag]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: docker-image-digest-*
          path: ${{ runner.temp }}/docker-digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Require immutable release tag before manifest credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag_sha="$(gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "/repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          if [[ "$tag_sha" != "$RELEASE_SHA" ]]; then
            echo "ERROR: $RELEASE_TAG moved from release SHA $RELEASE_SHA to $tag_sha."
            exit 1
          fi
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create or verify digest-bound multi-arch manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag_sha="$(gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "/repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          if [[ "$tag_sha" != "$RELEASE_SHA" ]]; then
            echo "ERROR: $RELEASE_TAG moved from release SHA $RELEASE_SHA to $tag_sha."
            exit 1
          fi
          TAG="${{ env.RELEASE_TAG }}"
          IMG="ghcr.io/7xuanlu/wenlan-server"
          amd="$(cat "$RUNNER_TEMP/docker-digests/docker-image-digest-amd64.txt")"
          arm="$(cat "$RUNNER_TEMP/docker-digests/docker-image-digest-arm64.txt")"
          [[ "$amd" =~ ^${IMG}@sha256:[0-9a-f]{64}$ ]]
          [[ "$arm" =~ ^${IMG}@sha256:[0-9a-f]{64}$ ]]

          verify_manifest() {
            local ref="$1" raw amd_actual arm_actual
            raw="$(docker buildx imagetools inspect "$ref" --raw)"
            amd_actual="$(jq -er '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest] | if length == 1 then .[0] else error("expected one amd64 manifest") end' <<<"$raw")"
            arm_actual="$(jq -er '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest] | if length == 1 then .[0] else error("expected one arm64 manifest") end' <<<"$raw")"
            [[ "$amd_actual" == "${amd#*@}" && "$arm_actual" == "${arm#*@}" ]]
          }

          if docker buildx imagetools inspect "$IMG:$TAG" >/dev/null 2>&1; then
            verify_manifest "$IMG:$TAG" || {
              echo "Existing $IMG:$TAG differs from validated platform digests."
              exit 1
            }
          else
            docker buildx imagetools create -t "$IMG:$TAG" "$amd" "$arm"
            verify_manifest "$IMG:$TAG"
          fi

          if [[ "$TAG" == *-* ]]; then
            echo "$TAG is a prerelease tag; latest remains unchanged."
            exit 0
          fi
          set +e
          refs="$(gh api --paginate \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "/repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" \
            --jq '.[].ref')"
          tag_list_status=$?
          set -e
          if [[ "$tag_list_status" -ne 0 ]]; then
            echo "Unable to list release tags; refusing to decide latest."
            exit 1
          fi
          tags="$(printf '%s\n' "$refs" | sed 's#^refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)"
          highest="$(printf '%s\n' "$tags" | sed '/^$/d' | sort -V | tail -1)"
          if [[ -z "$highest" ]]; then
            echo "No stable release tags resolved; refusing to decide latest."
            exit 1
          fi
          if [[ "$highest" != "$TAG" ]]; then
            echo "$TAG is not the highest stable tag ($highest); latest remains unchanged."
            exit 0
          fi
          docker buildx imagetools create -t "$IMG:latest" "$amd" "$arm"
          verify_manifest "$IMG:latest"

  publish-crates:
    name: Publish crates.io (wenlan-types + wenlan-mcp)
    needs: [promote-assets, bind-release-tag]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          fetch-tags: true

      - name: Verify release checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          checkout_sha="$(git rev-parse HEAD)"
          tag_sha="$(gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "/repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          if [[ "$checkout_sha" != "$RELEASE_SHA" || "$tag_sha" != "$RELEASE_SHA" ]]; then
            echo "ERROR: release SHA $RELEASE_SHA, checkout $checkout_sha, and current tag $tag_sha differ."
            exit 1
          fi

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve workspace version
        id: version
        run: |
          VERSION=$(grep -E '^version = ' Cargo.toml | head -1 | sed -E 's/version = "([^"]+)".*/\1/')
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Workspace version: $VERSION"

      - name: Publish wenlan-types to crates.io
        # Cargo publish performs the packaged-crate build verification and then
        # polls the index itself. The helper preserves that verification, adds
        # an exact sparse-index precheck, and reconciles Cargo's documented
        # post-upload timeout without another ten-minute workflow loop.
        run: |
          set -euo pipefail
          tag_sha="$(gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "/repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          if [[ "$tag_sha" != "$RELEASE_SHA" ]]; then
            echo "ERROR: $RELEASE_TAG moved from release SHA $RELEASE_SHA to $tag_sha."
            exit 1
          fi
          VERSION="${{ steps.version.outputs.value }}"
          python3 scripts/publish-crate.py \
            --package wenlan-types \
            --version "$VERSION"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          GH_TOKEN: ${{ github.token }}

      - name: Publish wenlan-mcp to crates.io
        # The successful wenlan-types helper return includes a short exact
        # sparse-index visibility proof, so Cargo can resolve that dependency.
        run: |
          set -euo pipefail
          tag_sha="$(gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "/repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          if [[ "$tag_sha" != "$RELEASE_SHA" ]]; then
            echo "ERROR: $RELEASE_TAG moved from release SHA $RELEASE_SHA to $tag_sha."
            exit 1
          fi
          VERSION="${{ steps.version.outputs.value }}"
          python3 scripts/publish-crate.py \
            --package wenlan-mcp \
            --version "$VERSION"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          GH_TOKEN: ${{ github.token }}

  publish-npm:
    name: Publish to npm
    needs: [promote-assets, bind-release-tag]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write    # OIDC trusted publishing
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          fetch-tags: true
      - name: Verify release checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          checkout_sha="$(git rev-parse HEAD)"
          tag_sha="$(gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "/repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          if [[ "$checkout_sha" != "$RELEASE_SHA" || "$tag_sha" != "$RELEASE_SHA" ]]; then
            echo "ERROR: release SHA $RELEASE_SHA, checkout $checkout_sha, and current tag $tag_sha differ."
            exit 1
          fi
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Ensure npm supports OIDC trusted publishing
        # Trusted publishing (tokenless OIDC) requires npm >= 11.5.1. Node 24's
        # bundled npm may lag; pin to latest so the OIDC handshake is available.
        run: npm install -g npm@latest
      - name: Sync npm version from tag
        working-directory: crates/wenlan-mcp/npm
        run: |
          VERSION="${RELEASE_TAG#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version --ignore-scripts
      - name: Sync setup package version from tag
        working-directory: crates/wenlan-cli/npm
        run: |
          VERSION="${RELEASE_TAG#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version --ignore-scripts
      - name: Copy root README and LICENSE into npm packages
        # npm renders README.md on the package page and surfaces LICENSE on
        # the package metadata. Copying root files ensures both packages
        # always reflect the current project description and the same legal
        # text the daemon ships under.
        run: |
          cp README.md crates/wenlan-mcp/npm/README.md
          cp README.md crates/wenlan-cli/npm/README.md
          cp LICENSE crates/wenlan-mcp/npm/LICENSE
          cp LICENSE crates/wenlan-cli/npm/LICENSE
      - name: Publish wenlan-mcp
        working-directory: crates/wenlan-mcp/npm
        # Skip if version already on npm. Retried releases or re-dispatch
        # workflows would otherwise fail with "You cannot publish over the
        # previously published versions". `npm view <pkg>@<v> version`
        # exits 0 + prints the version when published, exits 1 otherwise.
        run: |
          set -euo pipefail
          tag_sha="$(gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "/repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          if [[ "$tag_sha" != "$RELEASE_SHA" ]]; then
            echo "ERROR: $RELEASE_TAG moved from release SHA $RELEASE_SHA to $tag_sha."
            exit 1
          fi
          VERSION="${RELEASE_TAG#v}"
          if npm view "wenlan-mcp@$VERSION" version >/dev/null 2>&1; then
            echo "wenlan-mcp@$VERSION already on npm, skipping"
          else
            npm publish --provenance --access public
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish wenlan
        working-directory: crates/wenlan-cli/npm
        run: |
          set -euo pipefail
          tag_sha="$(gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "/repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          if [[ "$tag_sha" != "$RELEASE_SHA" ]]; then
            echo "ERROR: $RELEASE_TAG moved from release SHA $RELEASE_SHA to $tag_sha."
            exit 1
          fi
          VERSION="${RELEASE_TAG#v}"
          if npm view "wenlan@$VERSION" version >/dev/null 2>&1; then
            echo "wenlan@$VERSION already on npm, skipping"
          else
            npm publish --provenance --access public
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  update-homebrew:
    name: Update Homebrew tap
    needs: [promote-assets, bind-release-tag]
    # The tap ships macOS arm64 archives. Validate the formulas with the real
    # Homebrew client on the same architecture instead of stopping at `ruby -c`.
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: homebrew-artifacts
          merge-multiple: true
      - name: Compute checksums and update formulae
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          require_event_tag() {
            local tag_sha
            tag_sha="$(gh api --method GET \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "/repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
            if [[ "$tag_sha" != "$RELEASE_SHA" ]]; then
              echo "ERROR: $RELEASE_TAG moved from release SHA $RELEASE_SHA to $tag_sha."
              exit 1
            fi
          }
          require_event_tag
          VERSION="${RELEASE_TAG#v}"
          SHA_MCP_DARWIN_ARM64=$(shasum -a 256 wenlan-mcp-darwin-arm64.tar.gz | cut -d' ' -f1)
          SHA_DARWIN_ARM64=$(shasum -a 256 wenlan-darwin-arm64.tar.gz | cut -d' ' -f1)

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/7xuanlu/homebrew-tap.git" tap
          mkdir -p tap/Formula

          cat > tap/Formula/wenlan-mcp.rb << 'FORMULA'
          class WenlanMcp < Formula
            desc "MCP server for Wenlan — personal agent memory layer"
            homepage "https://github.com/7xuanlu/wenlan"
            version "VERSION_PLACEHOLDER"
            url "https://github.com/7xuanlu/wenlan/releases/download/vVERSION_PLACEHOLDER/wenlan-mcp-darwin-arm64.tar.gz"
            sha256 "SHA_PLACEHOLDER"
            license "Apache-2.0"

            livecheck do
              url :homepage
              strategy :github_latest
            end

            on_macos do
              depends_on arch: :arm64
            end

            def install
              bin.install "wenlan-mcp"
            end

            test do
              assert_match "wenlan-mcp", shell_output("#{bin}/wenlan-mcp --help")
            end
          end
          FORMULA

          # This job runs on macOS, whose sed reads `-i` as the backup suffix
          # and would swallow the script. perl -pi edits in place identically
          # on BSD and GNU hosts, and reading the values from the environment
          # keeps a SHA or version out of the expression itself.
          VERSION="$VERSION" SHA="$SHA_MCP_DARWIN_ARM64" perl -pi \
            -e 's/VERSION_PLACEHOLDER/$ENV{VERSION}/g; s/SHA_PLACEHOLDER/$ENV{SHA}/g' \
            tap/Formula/wenlan-mcp.rb

          # The formula installs from the full darwin archive, not the CLI-only one:
          # `wenlan background on` looks for wenlan-server next to the `wenlan`
          # binary, so a CLI-only install failed at the documented first step
          # (first-run gauntlet finding F7). wenlan-mcp stays in its own formula.
          cat > tap/Formula/wenlan.rb << 'FORMULA'
          class Wenlan < Formula
            desc "Wenlan CLI and daemon — local-first memory + knowledge layer for AI agents"
            homepage "https://github.com/7xuanlu/wenlan"
            version "VERSION_PLACEHOLDER"
            url "https://github.com/7xuanlu/wenlan/releases/download/vVERSION_PLACEHOLDER/wenlan-darwin-arm64.tar.gz"
            sha256 "SHA_PLACEHOLDER"
            license "Apache-2.0"

            livecheck do
              url :homepage
              strategy :github_latest
            end

            on_macos do
              depends_on arch: :arm64
            end

            def install
              bin.install "wenlan", "wenlan-server"
            end

            test do
              assert_match "wenlan", shell_output("#{bin}/wenlan --help")
              assert_match "wenlan-server", shell_output("#{bin}/wenlan-server --help")
            end
          end
          FORMULA

          VERSION="$VERSION" SHA="$SHA_DARWIN_ARM64" perl -pi \
            -e 's/VERSION_PLACEHOLDER/$ENV{VERSION}/g; s/SHA_PLACEHOLDER/$ENV{SHA}/g' \
            tap/Formula/wenlan.rb

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/wenlan-mcp.rb Formula/wenlan.rb
          if git diff --cached --quiet; then
            echo "Homebrew formulas already describe ${VERSION}; nothing to commit."
          else
            git commit -m "wenlan + wenlan-mcp ${VERSION}"
            require_event_tag
            git push origin HEAD:main
          fi

      - name: Verify formula syntax
        run: |
          ruby -c tap/Formula/wenlan-mcp.rb
          ruby -c tap/Formula/wenlan.rb

      - name: Verify anonymous Homebrew install path
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          rm -rf public-tap
          git clone https://github.com/7xuanlu/homebrew-tap.git public-tap
          cmp tap/Formula/wenlan-mcp.rb public-tap/Formula/wenlan-mcp.rb
          cmp tap/Formula/wenlan.rb public-tap/Formula/wenlan.rb

          brew untap 7xuanlu/tap >/dev/null 2>&1 || true
          brew tap 7xuanlu/tap https://github.com/7xuanlu/homebrew-tap.git
          brew install 7xuanlu/tap/wenlan 7xuanlu/tap/wenlan-mcp
          brew test 7xuanlu/tap/wenlan
          brew test 7xuanlu/tap/wenlan-mcp

  finalize-release:
    name: Promote the prerelease
    # Runs only after EVERY build + publish job succeeds. A failure in any of
    # them skips this job (GitHub requires all `needs` to succeed), so the
    # release stays a prerelease â€” never a `releases/latest` without artifacts.
    # docker-manifest is itself the fail-closed promotion barrier over every
    # required channel; only after it publishes the aliases may GitHub's
    # prerelease become the latest stable release. promote-app-assets is named
    # separately because nothing else waits on it any more: the desktop uploads
    # were split out of promote-assets so a failed app build stops the app
    # assets alone, and this `needs` entry is what still keeps a release
    # missing its installers out of `releases/latest`.
    needs: [docker-manifest, promote-app-assets, bind-release-tag]
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      # The lifecycle target is the merged release PR, so every call here is a
      # pull-requests scope: GET /commits/{sha}/pulls to find it, then POST and
      # DELETE on /issues/{pr}/labels to move it from pending to tagged. The
      # /issues/ path is only the REST spelling — a pull request routes label
      # WRITES through pull-requests, which is why `maintain-release-pr` labels
      # this same PR with pull-requests: write and no issues scope at all.
      # Granting only read here returned 403 after `gh release edit` had already
      # promoted the release, leaving v0.15.5 stable but still labelled pending.
      pull-requests: write
    steps:
      # The Install section prepare-release writes is entirely command line:
      # three `npx`, two `curl | bash`. A Windows user has none of those, so the
      # one artifact built for them was reachable only by expanding a collapsed
      # list of fifteen assets. The links belong in the notes — but not in
      # prepare-release, which creates the prerelease publicly and in parallel
      # with the two bundle jobs, so a link written there points at nothing for
      # the 40-210 minutes they run, and forever if either one fails. This job
      # needs promote-app-assets, so by here the installers are really on the
      # release; the step still checks rather than assuming, and refuses to
      # write a link it cannot see the target of.
      - name: Publish SHA256SUMS
        run: |
          set -euo pipefail
          tag_sha="$(gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "/repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          if [[ "$tag_sha" != "$RELEASE_SHA" ]]; then
            echo "ERROR: $RELEASE_TAG moved from release SHA $RELEASE_SHA to $tag_sha." >&2
            exit 1
          fi

          release_json="$(gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2026-03-10' "/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"

          missing_digest="$(jq -r '[.assets[] | select(.name != "SHA256SUMS") | select((.digest // "") | startswith("sha256:") | not) | .name] | join(", ")' <<<"$release_json")"
          if [[ -n "$missing_digest" ]]; then
            echo "ERROR: GitHub has no sha256 digest recorded for: $missing_digest" >&2
            exit 1
          fi

          jq -r '[.assets[] | select(.name != "SHA256SUMS")] | sort_by(.name) | .[] | "\(.digest | sub("^sha256:"; ""))  \(.name)"' \
            <<<"$release_json" > "$RUNNER_TEMP/SHA256SUMS"

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' | grep -Fxq "SHA256SUMS"; then
            mkdir -p "$RUNNER_TEMP/existing-sha256sums"
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern SHA256SUMS --dir "$RUNNER_TEMP/existing-sha256sums" --clobber
            if cmp -s "$RUNNER_TEMP/SHA256SUMS" "$RUNNER_TEMP/existing-sha256sums/SHA256SUMS"; then
              echo "SHA256SUMS already present on $RELEASE_TAG and matches; not re-uploading."
            else
              echo "ERROR: SHA256SUMS already exists on $RELEASE_TAG and differs from the recomputed file." >&2
              exit 1
            fi
          else
            gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/SHA256SUMS" --repo "$GITHUB_REPOSITORY"
          fi

          echo "---- SHA256SUMS ----"
          cat "$RUNNER_TEMP/SHA256SUMS"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote
        run: |
          set -euo pipefail
          require_event_tag() {
            local current
            current="$(gh api --method GET \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "/repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
            if [[ "$current" != "$RELEASE_SHA" ]]; then
              echo "ERROR: $RELEASE_TAG moved from release SHA $RELEASE_SHA to $current." >&2
              exit 1
            fi
            printf '%s' "$current"
          }
          tag_sha="$(require_event_tag)"
          if [[ "$RELEASE_TAG" == *-* ]]; then
            echo "$RELEASE_TAG is a prerelease tag; leaving it unpromoted."
          else
            set +e
            refs="$(gh api --paginate \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "/repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" \
              --jq '.[].ref')"
            tag_list_status=$?
            set -e
            if [[ "$tag_list_status" -ne 0 ]]; then
              echo "Unable to list release tags; refusing to decide latest." >&2
              exit 1
            fi
            tags="$(printf '%s\n' "$refs" | sed 's#^refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)"
            highest="$(printf '%s\n' "$tags" | sed '/^$/d' | sort -V | tail -1)"
            if [[ -z "$highest" ]]; then
              echo "No stable release tags resolved; refusing to decide latest." >&2
              exit 1
            fi
            latest_args=()
            if [[ "$highest" == "$RELEASE_TAG" ]]; then
              latest_args+=(--latest)
            else
              echo "$RELEASE_TAG is not the highest stable tag ($highest); not moving latest."
            fi
            tag_sha="$(require_event_tag)"
            gh release edit "$RELEASE_TAG" \
              --prerelease=false \
              "${latest_args[@]}" \
              --repo "$GITHUB_REPOSITORY"
          fi

          tag_sha="$(require_event_tag)"
          pr_number="$(gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "/repos/$GITHUB_REPOSITORY/commits/$tag_sha/pulls?per_page=100" \
            --jq '[.[] | select(.head.ref == "release-please--branches--main" and .base.ref == "main" and .merged_at != null)] | if length == 1 then .[0].number else error("expected one merged release PR") end')"
          # Add first so a transient second API failure is recoverable on rerun
          # without losing the release lifecycle marker entirely.
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "/repos/$GITHUB_REPOSITORY/issues/$pr_number/labels" \
            --input - <<<'{"labels":["autorelease: tagged"]}' >/dev/null
          labels="$(gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "/repos/$GITHUB_REPOSITORY/issues/$pr_number/labels?per_page=100")"
          if jq -e '[.[].name] | index("autorelease: pending") != null' \
            <<<"$labels" >/dev/null; then
            gh api --method DELETE \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "/repos/$GITHUB_REPOSITORY/issues/$pr_number/labels/autorelease%3A%20pending" \
              >/dev/null
          fi
          labels="$(gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "/repos/$GITHUB_REPOSITORY/issues/$pr_number/labels?per_page=100")"
          jq -e \
            '([.[].name] | index("autorelease: tagged") != null) and
             ([.[].name] | index("autorelease: pending") == null)' \
            <<<"$labels" >/dev/null
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # After Promote, before the cleanup PR. Publish SHA256SUMS and
      # Promote are load-bearing and this step is cosmetic, so a filename
      # it cannot match must never be what leaves a release unpromoted or
      # unchecksummed. It sits ahead of the cleanup PR because that step
      # can fail after creating its branch and then exit 0 on the re-run,
      # so putting the links behind it would let a release keep the notes
      # it shipped with.
      - name: Link the desktop app from the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Same derivation as app-bundle-windows: all four secrets, not one.
          # Whether the installer is signed decides whether the notes should
          # warn about SmartScreen, and hardcoding "unsigned" would quietly
          # become a lie the day signing is switched on. Nothing is claimed
          # about macOS, which is Developer ID signed and notarized from
          # v0.17.4 (docs/code-signing.md) and needs no warning at all.
          SIGNPATH_CONFIGURED: ${{ secrets.SIGNPATH_API_TOKEN != '' && secrets.SIGNPATH_ORGANIZATION_ID != '' && secrets.SIGNPATH_PROJECT_SLUG != '' && secrets.SIGNPATH_SIGNING_POLICY_SLUG != '' }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          win="Wenlan_${version}_x64-setup.exe"
          dmg="Wenlan_${version}_aarch64.dmg"

          names="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name')"
          for asset in "$win" "$dmg"; do
            grep -Fxq "$asset" <<<"$names" || {
              echo "ERROR: $asset is not on $RELEASE_TAG; refusing to link it." >&2
              exit 1
            }
          done

          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG"
          {
            echo "**Desktop app:**"
            echo
            echo "- Windows: [$win]($base/$win)"
            echo "- macOS (Apple silicon): [$dmg]($base/$dmg)"
            echo
            # Signing does not simply switch the warning off. Microsoft weighs
            # the file's hash as well as the publisher certificate, so a newly
            # signed binary can still warn until one of the two accumulates
            # reputation, and the Foundation certificate names SignPath rather
            # than Wenlan (docs/code-signing.md). Dropping this the day signing
            # lands would take the instructions away from users who still need
            # them; only the reason changes. Both branches say "may": SmartScreen
            # can be off, and reputation can already have accumulated.
            if [[ "$SIGNPATH_CONFIGURED" == "true" ]]; then
              echo "Windows may still show \"Windows protected your PC\" until this download's hash or its publisher has built up enough reputation — choose **More info → Run anyway**."
            else
              echo "The Windows installer is not code-signed yet, so Windows may show \"Windows protected your PC\" on first run — choose **More info → Run anyway**."
            fi
            echo
          } > "$RUNNER_TEMP/desktop.md"

          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json body --jq .body > "$RUNNER_TEMP/body.md"

          # GitHub stores whatever line endings the writer used, and anything
          # edited through the web UI comes back CRLF. Left alone, awk's
          # `$0 == "## Install"` would be comparing against "## Install\r" and
          # the step would report a missing heading on a release that has one.
          # Stripping CR changes no rendered character.
          sed -i 's/\r$//' "$RUNNER_TEMP/body.md"

          # Only the Install section counts as "already linked". A bullet
          # identical to ours can sit in a changelog entry or a fenced example
          # elsewhere in the notes, and treating that as the real section would
          # exit green having linked nothing. Trailing whitespace is ignored
          # here but preserved in the body that gets written back.
          awk '/^## /{ inside = ($0 == "## Install") } inside' "$RUNNER_TEMP/body.md" \
            | sed 's/[[:space:]]*$//' > "$RUNNER_TEMP/install.md"

          # Both link lines or neither. Matching one would call a half-repaired
          # note finished, and exiting green there restores the very defect this
          # step exists to fix, so a partial state stops the step instead.
          #
          # The markers are the two rendered list items, matched whole-line with
          # -Fx, and deliberately not the "**Desktop app:**" heading or a bare
          # URL. The heading is what release-please renders for an ordinary
          # `fix(Desktop app):` commit, so keying on it would make a normal
          # changelog look half-linked. A bare URL is worse in both directions:
          # a changelog that merely mentions the installer URL would fail the
          # job, and a body that happened to carry both URLs somewhere else
          # would be declared done while the Install section still had nothing
          # in it. A whole line of the exact form written below is the section
          # itself, not a substring that can wander in from prose.
          present=0
          while IFS= read -r marker; do
            [[ -n "$marker" ]] || continue
            # -- because every marker starts with "- ", which grep would
            # otherwise read as a bundle of short options.
            if grep -Fxq -- "$marker" "$RUNNER_TEMP/install.md"; then
              present=$((present + 1))
            fi
          done <<<"$(grep '^- ' "$RUNNER_TEMP/desktop.md")"
          if [[ "$present" -eq 2 ]]; then
            echo "Desktop links already present on $RELEASE_TAG; nothing to do."
            exit 0
          fi
          if [[ "$present" -ne 0 ]]; then
            echo "ERROR: the $RELEASE_TAG notes already carry $present of the 2 desktop links; refusing to guess at the rest." >&2
            exit 1
          fi

          # Insert under the Install heading so the desktop app is the first
          # thing a reader of that section sees.
          awk -v block="$RUNNER_TEMP/desktop.md" '
            { print }
            !inserted && $0 == "## Install" {
              print ""
              while ((getline line < block) > 0) print line
              inserted = 1
            }
            END { if (!inserted) exit 3 }
          ' "$RUNNER_TEMP/body.md" > "$RUNNER_TEMP/body.new.md" || {
            echo "ERROR: no '## Install' heading in the $RELEASE_TAG notes; left unchanged." >&2
            exit 1
          }

          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --notes-file "$RUNNER_TEMP/body.new.md"
          echo "---- desktop section ----"
          cat "$RUNNER_TEMP/desktop.md"

      - name: Open the release-as override cleanup PR
        # A deliberate minor/major is steered by a one-shot `release-as`
        # override in release-please-config.json (docs/RELEASING.md,
        # version-steering policy), but release-please never consumes it: its
        # docs warn that later runs "will continue to use this version". Once
        # the overridden version is released, open the removal PR here so
        # nobody has to remember it; the candidate validator independently
        # rejects a stale override, so a forgotten merge fails the next
        # release candidate instead of re-tagging. Everything runs through the
        # REST API against fresh `main` content — no checkout, and the commit
        # is pushed with RELEASE_TOKEN because a GITHUB_TOKEN-created branch
        # would not trigger the PR's required CI. Merging stays manual.
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          if [[ "$RELEASE_TAG" == *-* ]]; then
            echo "$RELEASE_TAG is a prerelease tag; leaving any override in place."
            exit 0
          fi
          config_response="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "/repos/$GITHUB_REPOSITORY/contents/release-please-config.json?ref=main")"
          jq -r '.content' <<<"$config_response" | base64 -d > "$RUNNER_TEMP/rp-config.json"
          release_as="$(jq -r '.packages["."]["release-as"] // empty' "$RUNNER_TEMP/rp-config.json")"
          if [[ -z "$release_as" ]]; then
            echo "No release-as override on main; nothing to clean up."
            exit 0
          fi
          if [[ "$release_as" != "$version" ]]; then
            echo "Override on main is $release_as, not the just-released $version; leaving it for a human."
            exit 0
          fi
          branch="release-as-cleanup-$version"
          if gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" >/dev/null 2>&1; then
            echo "Cleanup branch $branch already exists; assuming an earlier attempt opened the PR."
            exit 0
          fi
          python3 - "$RUNNER_TEMP/rp-config.json" <<'PY'
          import json, sys
          path = sys.argv[1]
          with open(path) as f:
              config = json.load(f)
          config["packages"]["."].pop("release-as", None)
          with open(path, "w") as f:
              json.dump(config, f, indent=2)
              f.write("\n")
          PY
          main_sha="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "/repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "/repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/heads/$branch" -f sha="$main_sha" >/dev/null
          gh api --method PUT \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "/repos/$GITHUB_REPOSITORY/contents/release-please-config.json" \
            -f message="chore: drop the release-as override now that $version is cut" \
            -f content="$(base64 < "$RUNNER_TEMP/rp-config.json" | tr -d '\n')" \
            -f sha="$(jq -r '.sha' <<<"$config_response")" \
            -f branch="$branch" >/dev/null
          jq -n \
            --arg title "chore: drop the release-as override now that $version is cut" \
            --arg head "$branch" \
            --arg body "Automated follow-up from the v$version release: the one-shot release-as override has been consumed, and release-please would otherwise keep proposing $version (see docs/RELEASING.md, version-steering policy). The candidate validator rejects a stale override, so merging this unblocks the next release." \
            '{title: $title, head: $head, base: "main", body: $body}' \
          | gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "/repos/$GITHUB_REPOSITORY/pulls" --input - --jq '.html_url'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
