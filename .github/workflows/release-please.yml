name: Release Please

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-please-main
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@0dfd8538845b8e92600d271a895a5372865d4062 # v5
        id: release
        with:
          # No release-type input — setting it makes the action ignore config-file.
          manifest-file: .release-please-manifest.json
          config-file: release-please-config.json
          target-branch: main
          # GITHUB_TOKEN events don't trigger other workflows (GitHub security policy).
          # A fine-grained PAT with contents:write lets the tag push trigger release.yml.
          token: ${{ secrets.RELEASE_TOKEN }}

      # When a release PR is open, also bump Cargo.toml versions
      # (release-please can't handle Cargo workspace manifests).
      #
      # IMPORTANT: use the same RELEASE_TOKEN PAT that release-please-action
      # used to create the PR. The subsequent `git push` of synced version
      # files needs to fire a `pull_request synchronize` event so CI runs
      # against the new HEAD — GITHUB_TOKEN-driven pushes never trigger
      # downstream workflows (GitHub security policy), which would leave the
      # PR head with empty `statusCheckRollup` and block branch protection.
      - name: Checkout (for Cargo version sync)
        if: steps.release.outputs.pr != ''
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: release-please--branches--main
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Sync versions to all manifests
        if: steps.release.outputs.pr != ''
        run: bash scripts/bump-version.sh

      - name: Commit synced versions to release PR branch
        if: steps.release.outputs.pr != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -u stages whatever bump-version.sh actually modified. A hardcoded
          # path list rots when files move: the 0.10.1 release merged with
          # version drift because `git add ... plugin/skills/init/SKILL.md`
          # crashed (exit 128) after that skill was renamed to setup/.
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync versions to $(cat version.txt | tr -d '[:space:]')"
            git push origin HEAD
          else
            echo "No version drift; nothing to commit."
          fi
