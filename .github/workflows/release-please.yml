name: Release Please

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: release-please-main
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

jobs:
  route-main:
    name: Route tested main commit
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      state: ${{ steps.release-gate.outputs.release-gate-state }}
      pr-number: ${{ steps.release-gate.outputs.release-pr-number }}
      tag: ${{ steps.release-gate.outputs.release-tag }}
      version: ${{ steps.release-gate.outputs.release-version }}
    steps:
      # workflow_run executes trusted default-branch code. The observed main
      # run is revalidated through the Actions API before its SHA is routed.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify observed main CI identity
        env:
          GH_TOKEN: ${{ github.token }}
          OBSERVED_RUN_ID: ${{ github.event.workflow_run.id }}
          OBSERVED_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          OBSERVED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          run="$RUNNER_TEMP/observed-main-run.json"
          workflow="$RUNNER_TEMP/observed-main-workflow.json"
          gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "/repos/$GITHUB_REPOSITORY/actions/runs/$OBSERVED_RUN_ID" > "$run"
          workflow_id="$(jq -er '.workflow_id | select(type == "number" and . > 0)' "$run")"
          gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id" > "$workflow"
          jq -e \
            --argjson id "$OBSERVED_RUN_ID" \
            --argjson attempt "$OBSERVED_RUN_ATTEMPT" \
            --arg sha "$OBSERVED_HEAD_SHA" \
            --arg repo "$GITHUB_REPOSITORY" \
            '.id == $id and .run_attempt == $attempt and
             .path == ".github/workflows/ci.yml" and .event == "push" and
             .status == "completed" and .conclusion == "success" and
             .head_branch == "main" and .head_sha == $sha and
             .repository.full_name == $repo and .head_repository.full_name == $repo' \
            "$run" >/dev/null
          jq -e \
            --argjson id "$workflow_id" \
            '.id == $id and .path == ".github/workflows/ci.yml" and .name == "CI" and .state == "active"' \
            "$workflow" >/dev/null
      - name: Consume the exact main CI promotion receipt
        id: release-gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release-promotion.py consume-main-receipt \
            --repository "$GITHUB_REPOSITORY" \
            --sha "${{ github.event.workflow_run.head_sha }}" \
            --temp-root "$RUNNER_TEMP" \
            --main-run-id "${{ github.event.workflow_run.id }}" \
            --main-run-attempt "${{ github.event.workflow_run.run_attempt }}" \
            --github-output "$GITHUB_OUTPUT"

  maintain-release-pr:
    name: Maintain release PR only
    needs: route-main
    if: needs.route-main.outputs.state == 'ordinary'
    runs-on: ubuntu-24.04
    concurrency:
      group: release-pr-maintenance-main
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@0dfd8538845b8e92600d271a895a5372865d4062 # v5
        id: release
        with:
          # Tagging and GitHub Release creation are owned exclusively by the
          # trusted receipt-gated path below.
          skip-github-release: true
          manifest-file: .release-please-manifest.json
          config-file: release-please-config.json
          target-branch: main
          token: ${{ secrets.RELEASE_TOKEN }}
      - name: Checkout trusted release PR synchronizer
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Resolve exact pending Release PR
        id: release_pr
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cp scripts/sync-release-pr.py "$RUNNER_TEMP/sync-release-pr.py"
          cp scripts/bump-version.sh "$RUNNER_TEMP/bump-version.sh"
          python3 "$RUNNER_TEMP/sync-release-pr.py" resolve \
            --repository "$GITHUB_REPOSITORY" \
            --github-output "$GITHUB_OUTPUT"
      - name: Checkout exact release PR head
        if: steps.release_pr.outputs.release_pr_state == 'present'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.release_pr.outputs.release_pr_head_sha }}
          token: ${{ secrets.RELEASE_TOKEN }}
          fetch-depth: 0
          persist-credentials: true
      - name: Merge main and sync release PR branch
        if: steps.release_pr.outputs.release_pr_state == 'present'
        run: |
          python3 "$RUNNER_TEMP/sync-release-pr.py" sync \
            --expected-head-sha "${{ steps.release_pr.outputs.release_pr_head_sha }}" \
            --bump-script "$RUNNER_TEMP/bump-version.sh"

  create-validated-tag:
    name: Create validated release tag
    needs: route-main
    if: needs.route-main.outputs.state == 'validated'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require pending release lifecycle and create exact tag
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          MAIN_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ needs.route-main.outputs.pr-number }}
          RELEASE_TAG: ${{ needs.route-main.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ || ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid receipt-derived PR or tag identity."
            exit 1
          fi
          labels="$(gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "/repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels?per_page=100")"
          pending="$(jq '[.[].name == "autorelease: pending"] | any' <<<"$labels")"
          tagged="$(jq '[.[].name == "autorelease: tagged"] | any' <<<"$labels")"
          existing_sha="$(gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "/repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
            --jq '.object.sha' 2>/dev/null || true)"
          if [[ -n "$existing_sha" ]]; then
            if [[ "$existing_sha" != "$MAIN_SHA" ]]; then
              echo "Existing $RELEASE_TAG points to $existing_sha, expected $MAIN_SHA."
              exit 1
            fi
            echo "$RELEASE_TAG already points to the exact validated merge commit."
            exit 0
          fi
          if [[ "$pending" != true || "$tagged" != false ]]; then
            echo "Release PR lifecycle is not exactly pending-before-tag."
            exit 1
          fi
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "/repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$RELEASE_TAG" \
            -f sha="$MAIN_SHA" >/dev/null
