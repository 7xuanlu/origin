  # ---------------------------------------------------------------------------
  # Summary: always runs, renders every findings.tsv into the run summary, then
  # turns the run red when any FAIL row exists so the verdict is visible at the
  # top while every channel still reported.
  # ---------------------------------------------------------------------------

  summary:
    name: Gauntlet summary
    if: always()
    needs:
      - resolve
      - macos-app
      - npx-setup
      - brew
      - npx-mcp
      - linux-install
      - windows-zip
      - windows-nsis
      - cargo-mcp
      - plugin-setup
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # Per-job folders are kept (no merge-multiple) so summary.py can label
      # each findings.tsv by the artifact it came from.
      - name: Download every findings artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: findings-*
          path: all-findings
      - name: Render summary
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          RESOLVE_RESULT: ${{ needs.resolve.result }}
        run: |
          set -euo pipefail
          mkdir -p all-findings
          {
            echo "# First-run gauntlet: ${TAG:-unresolved} (resolve: $RESOLVE_RESULT)"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/first-run/summary.py all-findings >> "$GITHUB_STEP_SUMMARY"
      - name: Upload combined findings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gauntlet-all-findings-${{ needs.resolve.outputs.tag || 'unresolved' }}
          path: all-findings
          retention-days: 30
          if-no-files-found: warn
      - name: Fail on FAIL rows
        # Runs even when rendering crashed so the verdict never depends on
        # summary.py's own health.
        if: always()
        env:
          RESOLVE_RESULT: ${{ needs.resolve.result }}
          RUN_MACOS_APP: ${{ needs.resolve.outputs.run-macos-app }}
          RUN_NPX_SETUP: ${{ needs.resolve.outputs.run-npx-setup }}
          RUN_BREW: ${{ needs.resolve.outputs.run-brew }}
          RUN_NPX_MCP: ${{ needs.resolve.outputs.run-npx-mcp }}
          RUN_LINUX_INSTALL: ${{ needs.resolve.outputs.run-linux-install }}
          RUN_WINDOWS_ZIP: ${{ needs.resolve.outputs.run-windows-zip }}
          RUN_WINDOWS_NSIS: ${{ needs.resolve.outputs.run-windows-nsis }}
          RUN_CARGO_MCP: ${{ needs.resolve.outputs.run-cargo-mcp }}
          RUN_PLUGIN_SETUP: ${{ needs.resolve.outputs.run-plugin-setup }}
        run: |
          set -euo pipefail
          status=0
          if [ "$RESOLVE_RESULT" != "success" ]; then
            echo "::error::resolve job ended with '$RESOLVE_RESULT'; no channel could run" >&2
            status=1
          fi
          # Unchecked is not a pass: every selected channel leg must have
          # produced a non-empty findings.tsv. A leg that dies before its
          # first check (checkout failure, timeout, syntax error) uploads
          # nothing, and grepping only what exists would let it read green.
          # The per-channel leg lists mirror each job's matrix — keep in sync.
          expected=""
          if [ "$RUN_MACOS_APP" = "true" ]; then expected="$expected findings-macos-app"; fi
          if [ "$RUN_NPX_SETUP" = "true" ]; then expected="$expected findings-npx-setup"; fi
          if [ "$RUN_BREW" = "true" ]; then expected="$expected findings-brew"; fi
          if [ "$RUN_NPX_MCP" = "true" ]; then expected="$expected findings-npx-mcp-macos-15 findings-npx-mcp-ubuntu-24.04 findings-npx-mcp-ubuntu-24.04-arm findings-npx-mcp-windows-2025"; fi
          if [ "$RUN_LINUX_INSTALL" = "true" ]; then expected="$expected findings-linux-install-ubuntu-24.04 findings-linux-install-ubuntu-24.04-arm"; fi
          if [ "$RUN_WINDOWS_ZIP" = "true" ]; then expected="$expected findings-windows-zip"; fi
          if [ "$RUN_WINDOWS_NSIS" = "true" ]; then expected="$expected findings-windows-nsis"; fi
          if [ "$RUN_CARGO_MCP" = "true" ]; then expected="$expected findings-cargo-mcp"; fi
          if [ "$RUN_PLUGIN_SETUP" = "true" ]; then expected="$expected findings-plugin-setup-ubuntu-24.04 findings-plugin-setup-macos-15"; fi
          for leg in $expected; do
            if [ ! -s "all-findings/$leg/findings.tsv" ]; then
              echo "::error::$leg produced no findings.tsv — that leg is unchecked, not green" >&2
              status=1
            fi
            # A NON-EMPTY findings.tsv is not a finished leg. A channel killed at
            # `timeout-minutes` after its precheck row and a few PASS rows leaves
            # exactly that: rows in the file, no FAIL row in it, ~27 declared rows
            # never recorded and Evaluate never reached -- and the grep below then
            # prints "No FAIL rows". `continue-on-error` rewrites the JOB result to
            # `success`, so needs.<job>.result cannot see it either. The channel
            # STEP's raw outcome can, and each leg carries its own beside its
            # findings. Missing, cancelled, failure and skipped are all refusals:
            # a leg that did not finish is unchecked, not green.
            outcome=unrecorded
            if [ -s "all-findings/$leg/channel-outcome.txt" ]; then
              outcome="$(tr -d '\r\n' < "all-findings/$leg/channel-outcome.txt")"
            fi
            if [ "$outcome" != "success" ]; then
              echo "::error::$leg's channel step ended '$outcome', not 'success' — that leg did not finish, so it is unchecked, not green" >&2
              status=1
            fi
          done
          if failing="$(grep -rl --include=findings.tsv $'\tFAIL\t' all-findings)"; then
            echo "::error::FAIL rows found in:" >&2
            while IFS= read -r path; do
              echo "  $path" >&2
            done <<< "$failing"
            grep -rh --include=findings.tsv $'\tFAIL\t' all-findings | cut -c1-300 >&2
            status=1
          else
            echo "No FAIL rows in any findings.tsv (one condition of several; the per-leg"
            echo "outcome and findings.tsv checks above are the rest of this verdict)"
          fi
          exit "$status"
