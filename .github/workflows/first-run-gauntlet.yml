# First-run gauntlet
#
# A user-path proof over *published* release artifacts. Each channel job starts
# from a clean GitHub-hosted runner and installs Wenlan exactly the way a new
# user would (DMG, `npx wenlan setup`, Homebrew tap, `npx wenlan-mcp`, the Linux
# tarball, the Windows zip and NSIS installer, `cargo install`, the Claude Code
# plugin), then records what it saw.
#
# This is findings-oriented, not gating: every channel runs to completion and
# reports, `continue-on-error` keeps one broken channel from hiding the others,
# and the `summary` job renders every findings.tsv into the run summary before
# turning the run red when any check FAILed. It never runs on the PR lane —
# it is `workflow_dispatch` only, because it exercises whatever is on the
# GitHub Release page, not the code in this checkout.
#
# Every channel script under scripts/first-run/ is runnable by hand on a real
# machine with the same environment the jobs set below:
#
#   TAG=v0.17.0 VERSION=0.17.0 IS_LATEST=true \
#   GAUNTLET_OUT=$PWD/gauntlet-out GAUNTLET_CHANNEL=brew REPO_ROOT=$PWD \
#   bash scripts/first-run/brew.sh
#
# The script exits nonzero when any of its checks FAILed but always leaves
# findings.tsv behind; `python3 scripts/first-run/summary.py gauntlet-out`
# renders the same Markdown the summary job does.

name: First-run gauntlet

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag (vX.Y.Z) or 'latest'
        required: false
        default: latest
        type: string
      channels:
        description: >-
          Comma-separated channel ids to run, or 'all':
          macos-app, npx-setup, brew, npx-mcp, linux-install, windows-zip,
          windows-nsis, cargo-mcp, plugin-setup
        required: false
        default: all
        type: string

permissions:
  contents: read

# One gauntlet per release tag at a time; never cancel a run that is already
# producing findings.
concurrency:
  group: first-run-gauntlet-${{ inputs.release_tag || 'latest' }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  resolve:
    name: Resolve release and inventory assets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      is_latest: ${{ steps.release.outputs.is_latest }}
      run-macos-app: ${{ steps.channels.outputs.run-macos-app }}
      run-npx-setup: ${{ steps.channels.outputs.run-npx-setup }}
      run-brew: ${{ steps.channels.outputs.run-brew }}
      run-npx-mcp: ${{ steps.channels.outputs.run-npx-mcp }}
      run-linux-install: ${{ steps.channels.outputs.run-linux-install }}
      run-windows-zip: ${{ steps.channels.outputs.run-windows-zip }}
      run-windows-nsis: ${{ steps.channels.outputs.run-windows-nsis }}
      run-cargo-mcp: ${{ steps.channels.outputs.run-cargo-mcp }}
      run-plugin-setup: ${{ steps.channels.outputs.run-plugin-setup }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # The release JSON is fetched once and reused by the inventory and parity
      # steps below so every job in the run talks about the same asset list.
      - name: Resolve release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag || 'latest' }}
        run: |
          set -euo pipefail
          latest_json="$RUNNER_TEMP/latest-release.json"
          release_json="$RUNNER_TEMP/release.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > "$latest_json"
          latest_tag="$(jq -r '.tag_name' "$latest_json")"
          if [ "$RELEASE_TAG_INPUT" = "latest" ]; then
            cp "$latest_json" "$release_json"
          else
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG_INPUT" > "$release_json"
          fi
          tag="$(jq -r '.tag_name' "$release_json")"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::release tag '$tag' is not a vX.Y.Z tag" >&2
            exit 1
          fi
          version="${tag#v}"
          is_latest=false
          if [ "$tag" = "$latest_tag" ]; then
            is_latest=true
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "is_latest=$is_latest"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved $tag (version $version, latest=$is_latest, latest release is $latest_tag)"

      - name: Select channels
        id: channels
        env:
          CHANNELS_INPUT: ${{ inputs.channels || 'all' }}
        run: |
          set -euo pipefail
          known=(macos-app npx-setup brew npx-mcp linux-install windows-zip windows-nsis cargo-mcp plugin-setup)
          requested=()
          if [ "$CHANNELS_INPUT" = "all" ]; then
            requested=("${known[@]}")
          else
            IFS=',' read -r -a raw <<< "$CHANNELS_INPUT"
            for item in "${raw[@]}"; do
              item="$(printf '%s' "$item" | xargs)"
              [ -n "$item" ] || continue
              found=false
              for id in "${known[@]}"; do
                if [ "$id" = "$item" ]; then found=true; fi
              done
              if [ "$found" != true ]; then
                echo "::error::unknown channel '$item' (known: ${known[*]})" >&2
                exit 1
              fi
              requested+=("$item")
            done
          fi
          if [ "${#requested[@]}" -eq 0 ]; then
            echo "::error::no channels selected from '$CHANNELS_INPUT'" >&2
            exit 1
          fi
          for id in "${known[@]}"; do
            run=false
            for item in "${requested[@]}"; do
              if [ "$id" = "$item" ]; then run=true; fi
            done
            echo "run-$id=$run" >> "$GITHUB_OUTPUT"
            echo "run-$id=$run"
          done

      # A gauntlet against a release with a missing asset is meaningless (the
      # channel that needs it would only report "404"), so this fails closed.
      # Digests matter because the macOS installer verifies `sha256:` before
      # it trusts a download.
      - name: Inventory release assets
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          release_json="$RUNNER_TEMP/release.json"
          expected=()
          while IFS= read -r name; do
            expected+=("$name")
          done < <(python3 scripts/release_targets.py assets | jq -r '.[].name')
          expected+=(
            latest.json
            "Wenlan_${VERSION}_aarch64.dmg"
            "Wenlan_${VERSION}_x64-setup.exe"
            "Wenlan_${VERSION}_x64-setup.exe.sig"
            Wenlan_aarch64.app.tar.gz
            Wenlan_aarch64.app.tar.gz.sig
          )
          missing=()
          undigested=()
          {
            echo "## Release assets for $TAG"
            echo
            echo "| Asset | Size (bytes) | Digest |"
            echo "|---|---:|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for name in "${expected[@]}"; do
            row="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | [.size, (.digest // "")] | @tsv' "$release_json")"
            if [ -z "$row" ]; then
              missing+=("$name")
              echo "| \`$name\` | — | **MISSING** |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            size="${row%%$'\t'*}"
            digest="${row#*$'\t'}"
            if [ -z "$digest" ]; then
              undigested+=("$name")
              echo "| \`$name\` | $size | **none** |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| \`$name\` | $size | present |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          extra="$(jq -r --argjson expected "$(printf '%s\n' "${expected[@]}" | jq -R . | jq -s .)" \
            '[.assets[].name] - $expected | .[]' "$release_json")"
          if [ -n "$extra" ]; then
            {
              echo
              echo "Additional assets on the release (not required by the gauntlet):"
              echo
              while IFS= read -r name; do
                echo "- \`$name\`"
              done <<< "$extra"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo >> "$GITHUB_STEP_SUMMARY"
          status=0
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::release $TAG is missing expected assets: ${missing[*]}" >&2
            status=1
          fi
          if [ "${#undigested[@]}" -gt 0 ]; then
            echo "::error::release $TAG has assets without a digest: ${undigested[*]}" >&2
            status=1
          fi
          exit "$status"

      # Parity is informational: a lagging npm/crates/tap version is a finding
      # the maintainer wants to see, not a reason to stop the gauntlet. Every
      # probe is wrapped so a flaky registry never fails this job.
      - name: Record publish parity
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
          GAUNTLET_OUT: ${{ github.workspace }}/gauntlet-out
        run: |
          set -uo pipefail
          release_json="$RUNNER_TEMP/release.json"
          mkdir -p "$GAUNTLET_OUT"
          tsv="$GAUNTLET_OUT/findings.tsv"
          {
            echo "## Publish parity for $TAG"
            echo
            echo "| Surface | Version | Parity |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          record() {
            # record NAME OBSERVED [LABEL]: INFO row plus a summary row, LAGS on mismatch.
            local name="$1" observed="$2" label="${3:-$1}" parity detail
            if [ -z "$observed" ]; then
              parity="UNKNOWN"
              detail="unavailable (expected $VERSION)"
            elif [ "$observed" = "$VERSION" ]; then
              parity="OK"
              detail="$observed matches release $VERSION"
            else
              parity="LAGS"
              detail="LAGS: $observed vs release $VERSION"
            fi
            printf 'resolve\t%s\tINFO\t0\t%s\n' "$name" "$detail" >> "$tsv"
            echo "| $label | ${observed:-unavailable} | $parity |" >> "$GITHUB_STEP_SUMMARY"
            echo "[INFO] $name: $detail"
          }
          formula_version() {
            # Prefer an explicit `version "X"` line; fall back to the vX.Y.Z in the url line.
            local body="$1" v
            v="$(printf '%s\n' "$body" | sed -n 's/^[[:space:]]*version[[:space:]]*"\([^"]*\)".*/\1/p' | head -1)"
            if [ -z "$v" ]; then
              v="$(printf '%s\n' "$body" | sed -n 's/^[[:space:]]*url[[:space:]]*"\(.*\)".*/\1/p' | head -1 \
                | sed -n 's/.*v\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\).*/\1/p')"
            fi
            printf '%s' "$v"
          }
          ua="wenlan-first-run-gauntlet (https://github.com/$GITHUB_REPOSITORY)"

          npm_wenlan="$(npm view wenlan version 2>/dev/null || true)"
          record npm-wenlan "$npm_wenlan" "npm \`wenlan\`"

          npm_mcp="$(npm view wenlan-mcp version 2>/dev/null || true)"
          record npm-wenlan-mcp "$npm_mcp" "npm \`wenlan-mcp\`"

          crate_mcp="$(curl -sSf --max-time 20 -A "$ua" https://crates.io/api/v1/crates/wenlan-mcp 2>/dev/null \
            | jq -r '.crate.max_version // empty' 2>/dev/null || true)"
          record crates-wenlan-mcp "$crate_mcp" "crates.io \`wenlan-mcp\`"

          tap_base="https://raw.githubusercontent.com/7xuanlu/homebrew-tap/main/Formula"
          tap_wenlan="$(formula_version "$(curl -sSfL --max-time 20 "$tap_base/wenlan.rb" 2>/dev/null || true)")"
          record brew-wenlan "$tap_wenlan" "Homebrew tap \`wenlan\`"

          tap_mcp="$(formula_version "$(curl -sSfL --max-time 20 "$tap_base/wenlan-mcp.rb" 2>/dev/null || true)")"
          record brew-wenlan-mcp "$tap_mcp" "Homebrew tap \`wenlan-mcp\`"

          latest_url="$(jq -r '.assets[] | select(.name == "latest.json") | .browser_download_url' "$release_json" 2>/dev/null | head -1)"
          updater_version=""
          if [ -n "$latest_url" ]; then
            updater_version="$(curl -sSfL --max-time 20 "$latest_url" 2>/dev/null | jq -r '.version // empty' 2>/dev/null | sed 's/^v//' || true)"
          fi
          record updater-latest-json "$updater_version" "Tauri updater \`latest.json\`"

          # Anonymous API budget matters because the installer paths resolve
          # releases without a token, exactly like a new user would. GET with
          # dumped headers, not HEAD: api.github.com answers HEAD /rate_limit
          # with 404.
          remaining="$(curl -s -D - -o /dev/null --max-time 20 https://api.github.com/rate_limit 2>/dev/null | grep -i '^x-ratelimit-remaining:' | tr -d '\r' || true)"
          printf 'resolve\tgithub-anonymous-rate-limit\tINFO\t0\t%s\n' "${remaining:-unavailable}" >> "$tsv"
          {
            echo
            echo "Anonymous GitHub API rate limit: \`${remaining:-unavailable}\`"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          echo "[INFO] github-anonymous-rate-limit: ${remaining:-unavailable}"

      - name: Upload resolve findings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: findings-resolve
          path: gauntlet-out
          retention-days: 30
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Channel jobs. Each one is `continue-on-error` so every channel reports and
  # `summary` always sees the full picture; the channel script itself decides
  # pass/fail per check and never aborts early. WENLAN_TEST_FASTEMBED_CACHE is
  # deliberately not set: a new user has no warm model cache.
  # ---------------------------------------------------------------------------

  macos-app:
    name: macOS app (DMG)
    needs: resolve
    if: needs.resolve.outputs.run-macos-app == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    continue-on-error: true
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      VERSION: ${{ needs.resolve.outputs.version }}
      IS_LATEST: ${{ needs.resolve.outputs.is_latest }}
      GAUNTLET_OUT: ${{ github.workspace }}/gauntlet-out
      GAUNTLET_CHANNEL: macos-app
      REPO_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Port 7878 precheck
        run: |
          mkdir -p "$GAUNTLET_OUT"
          listeners="$(lsof -nP -iTCP:7878 -sTCP:LISTEN 2>/dev/null || true)"
          detail="free"
          if [ -n "$listeners" ]; then
            detail="BUSY: $(printf '%s' "$listeners" | tr '\t\r' '  ' | tr '\n' '|' | head -c 2000)"
          fi
          printf '%s\tport-7878-precheck\tINFO\t0\t%s\n' "$GAUNTLET_CHANNEL" "$detail" >> "$GAUNTLET_OUT/findings.tsv"
          echo "[INFO] port-7878-precheck: $detail"
      - name: Run channel
        run: bash scripts/first-run/macos-app.sh
      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: findings-macos-app
          path: gauntlet-out
          retention-days: 30
          if-no-files-found: warn

  npx-setup:
    name: npx wenlan setup (macOS)
    needs: resolve
    if: needs.resolve.outputs.run-npx-setup == 'true'
    runs-on: macos-15
    timeout-minutes: 25
    continue-on-error: true
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      VERSION: ${{ needs.resolve.outputs.version }}
      IS_LATEST: ${{ needs.resolve.outputs.is_latest }}
      GAUNTLET_OUT: ${{ github.workspace }}/gauntlet-out
      GAUNTLET_CHANNEL: npx-setup
      REPO_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Port 7878 precheck
        run: |
          mkdir -p "$GAUNTLET_OUT"
          listeners="$(lsof -nP -iTCP:7878 -sTCP:LISTEN 2>/dev/null || true)"
          detail="free"
          if [ -n "$listeners" ]; then
            detail="BUSY: $(printf '%s' "$listeners" | tr '\t\r' '  ' | tr '\n' '|' | head -c 2000)"
          fi
          printf '%s\tport-7878-precheck\tINFO\t0\t%s\n' "$GAUNTLET_CHANNEL" "$detail" >> "$GAUNTLET_OUT/findings.tsv"
          echo "[INFO] port-7878-precheck: $detail"
      - name: Run channel
        run: bash scripts/first-run/npx-setup.sh
      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: findings-npx-setup
          path: gauntlet-out
          retention-days: 30
          if-no-files-found: warn

  brew:
    name: Homebrew tap (macOS)
    needs: resolve
    if: needs.resolve.outputs.run-brew == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    continue-on-error: true
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      VERSION: ${{ needs.resolve.outputs.version }}
      IS_LATEST: ${{ needs.resolve.outputs.is_latest }}
      GAUNTLET_OUT: ${{ github.workspace }}/gauntlet-out
      GAUNTLET_CHANNEL: brew
      REPO_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Port 7878 precheck
        run: |
          mkdir -p "$GAUNTLET_OUT"
          listeners="$(lsof -nP -iTCP:7878 -sTCP:LISTEN 2>/dev/null || true)"
          detail="free"
          if [ -n "$listeners" ]; then
            detail="BUSY: $(printf '%s' "$listeners" | tr '\t\r' '  ' | tr '\n' '|' | head -c 2000)"
          fi
          printf '%s\tport-7878-precheck\tINFO\t0\t%s\n' "$GAUNTLET_CHANNEL" "$detail" >> "$GAUNTLET_OUT/findings.tsv"
          echo "[INFO] port-7878-precheck: $detail"
      - name: Run channel
        run: bash scripts/first-run/brew.sh
      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: findings-brew
          path: gauntlet-out
          retention-days: 30
          if-no-files-found: warn

  npx-mcp:
    name: npx wenlan-mcp (${{ matrix.os }})
    needs: resolve
    if: needs.resolve.outputs.run-npx-mcp == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, ubuntu-24.04-arm, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    continue-on-error: true
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      VERSION: ${{ needs.resolve.outputs.version }}
      IS_LATEST: ${{ needs.resolve.outputs.is_latest }}
      GAUNTLET_OUT: ${{ github.workspace }}/gauntlet-out
      GAUNTLET_CHANNEL: npx-mcp-${{ matrix.os }}
      REPO_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Port 7878 precheck
        if: runner.os != 'Windows'
        run: |
          mkdir -p "$GAUNTLET_OUT"
          listeners="$(lsof -nP -iTCP:7878 -sTCP:LISTEN 2>/dev/null || true)"
          detail="free"
          if [ -n "$listeners" ]; then
            detail="BUSY: $(printf '%s' "$listeners" | tr '\t\r' '  ' | tr '\n' '|' | head -c 2000)"
          fi
          printf '%s\tport-7878-precheck\tINFO\t0\t%s\n' "$GAUNTLET_CHANNEL" "$detail" >> "$GAUNTLET_OUT/findings.tsv"
          echo "[INFO] port-7878-precheck: $detail"
      - name: Port 7878 precheck (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:GAUNTLET_OUT | Out-Null
          $listeners = Get-NetTCPConnection -LocalPort 7878 -State Listen -ErrorAction SilentlyContinue
          $detail = "free"
          if ($listeners) {
            $detail = "BUSY: " + (($listeners | ForEach-Object { "$($_.LocalAddress):$($_.LocalPort) pid=$($_.OwningProcess)" }) -join "|")
          }
          $line = "{0}`tport-7878-precheck`tINFO`t0`t{1}" -f $env:GAUNTLET_CHANNEL, $detail
          Add-Content -Path (Join-Path $env:GAUNTLET_OUT "findings.tsv") -Value $line -Encoding utf8
          Write-Host "[INFO] port-7878-precheck: $detail"
      - name: Run channel
        if: runner.os != 'Windows'
        run: bash scripts/first-run/npx-mcp.sh
      - name: Run channel (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -File scripts/first-run/npx-mcp.ps1
      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: findings-npx-mcp-${{ matrix.os }}
          path: gauntlet-out
          retention-days: 30
          if-no-files-found: warn

  linux-install:
    name: Linux tarball (${{ matrix.os }})
    needs: resolve
    if: needs.resolve.outputs.run-linux-install == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    continue-on-error: true
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      VERSION: ${{ needs.resolve.outputs.version }}
      IS_LATEST: ${{ needs.resolve.outputs.is_latest }}
      GAUNTLET_OUT: ${{ github.workspace }}/gauntlet-out
      GAUNTLET_CHANNEL: linux-install-${{ matrix.os }}
      REPO_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Port 7878 precheck
        run: |
          mkdir -p "$GAUNTLET_OUT"
          listeners="$(lsof -nP -iTCP:7878 -sTCP:LISTEN 2>/dev/null || true)"
          detail="free"
          if [ -n "$listeners" ]; then
            detail="BUSY: $(printf '%s' "$listeners" | tr '\t\r' '  ' | tr '\n' '|' | head -c 2000)"
          fi
          printf '%s\tport-7878-precheck\tINFO\t0\t%s\n' "$GAUNTLET_CHANNEL" "$detail" >> "$GAUNTLET_OUT/findings.tsv"
          echo "[INFO] port-7878-precheck: $detail"
      - name: Run channel
        run: bash scripts/first-run/linux-install.sh
      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: findings-linux-install-${{ matrix.os }}
          path: gauntlet-out
          retention-days: 30
          if-no-files-found: warn

  windows-zip:
    name: Windows zip
    needs: resolve
    if: needs.resolve.outputs.run-windows-zip == 'true'
    runs-on: windows-2025
    timeout-minutes: 25
    continue-on-error: true
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      VERSION: ${{ needs.resolve.outputs.version }}
      IS_LATEST: ${{ needs.resolve.outputs.is_latest }}
      GAUNTLET_OUT: ${{ github.workspace }}/gauntlet-out
      GAUNTLET_CHANNEL: windows-zip
      REPO_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Port 7878 precheck
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:GAUNTLET_OUT | Out-Null
          $listeners = Get-NetTCPConnection -LocalPort 7878 -State Listen -ErrorAction SilentlyContinue
          $detail = "free"
          if ($listeners) {
            $detail = "BUSY: " + (($listeners | ForEach-Object { "$($_.LocalAddress):$($_.LocalPort) pid=$($_.OwningProcess)" }) -join "|")
          }
          $line = "{0}`tport-7878-precheck`tINFO`t0`t{1}" -f $env:GAUNTLET_CHANNEL, $detail
          Add-Content -Path (Join-Path $env:GAUNTLET_OUT "findings.tsv") -Value $line -Encoding utf8
          Write-Host "[INFO] port-7878-precheck: $detail"
      - name: Run channel
        shell: pwsh
        run: pwsh -File scripts/first-run/windows-zip.ps1
      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: findings-windows-zip
          path: gauntlet-out
          retention-days: 30
          if-no-files-found: warn

  windows-nsis:
    name: Windows NSIS installer
    needs: resolve
    if: needs.resolve.outputs.run-windows-nsis == 'true'
    runs-on: windows-2025
    timeout-minutes: 30
    continue-on-error: true
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      VERSION: ${{ needs.resolve.outputs.version }}
      IS_LATEST: ${{ needs.resolve.outputs.is_latest }}
      GAUNTLET_OUT: ${{ github.workspace }}/gauntlet-out
      GAUNTLET_CHANNEL: windows-nsis
      REPO_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Port 7878 precheck
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:GAUNTLET_OUT | Out-Null
          $listeners = Get-NetTCPConnection -LocalPort 7878 -State Listen -ErrorAction SilentlyContinue
          $detail = "free"
          if ($listeners) {
            $detail = "BUSY: " + (($listeners | ForEach-Object { "$($_.LocalAddress):$($_.LocalPort) pid=$($_.OwningProcess)" }) -join "|")
          }
          $line = "{0}`tport-7878-precheck`tINFO`t0`t{1}" -f $env:GAUNTLET_CHANNEL, $detail
          Add-Content -Path (Join-Path $env:GAUNTLET_OUT "findings.tsv") -Value $line -Encoding utf8
          Write-Host "[INFO] port-7878-precheck: $detail"
      - name: Run channel
        shell: pwsh
        run: pwsh -File scripts/first-run/windows-nsis.ps1
      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: findings-windows-nsis
          path: gauntlet-out
          retention-days: 30
          if-no-files-found: warn

  cargo-mcp:
    name: cargo install wenlan-mcp (Linux)
    needs: resolve
    if: needs.resolve.outputs.run-cargo-mcp == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      VERSION: ${{ needs.resolve.outputs.version }}
      IS_LATEST: ${{ needs.resolve.outputs.is_latest }}
      GAUNTLET_OUT: ${{ github.workspace }}/gauntlet-out
      GAUNTLET_CHANNEL: cargo-mcp
      REPO_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Port 7878 precheck
        run: |
          mkdir -p "$GAUNTLET_OUT"
          listeners="$(lsof -nP -iTCP:7878 -sTCP:LISTEN 2>/dev/null || true)"
          detail="free"
          if [ -n "$listeners" ]; then
            detail="BUSY: $(printf '%s' "$listeners" | tr '\t\r' '  ' | tr '\n' '|' | head -c 2000)"
          fi
          printf '%s\tport-7878-precheck\tINFO\t0\t%s\n' "$GAUNTLET_CHANNEL" "$detail" >> "$GAUNTLET_OUT/findings.tsv"
          echo "[INFO] port-7878-precheck: $detail"
      - name: Run channel
        run: bash scripts/first-run/cargo-mcp.sh
      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: findings-cargo-mcp
          path: gauntlet-out
          retention-days: 30
          if-no-files-found: warn

  plugin-setup:
    name: Claude Code plugin setup (${{ matrix.os }})
    needs: resolve
    if: needs.resolve.outputs.run-plugin-setup == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    continue-on-error: true
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      VERSION: ${{ needs.resolve.outputs.version }}
      IS_LATEST: ${{ needs.resolve.outputs.is_latest }}
      GAUNTLET_OUT: ${{ github.workspace }}/gauntlet-out
      GAUNTLET_CHANNEL: plugin-setup-${{ matrix.os }}
      REPO_ROOT: ${{ github.workspace }}
      RELEASE_SRC: ${{ github.workspace }}/release-src
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # The plugin a user installs comes from the release tag's tree, not from
      # the workflow ref, so the channel gets a second checkout of the tag.
      - name: Checkout release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          path: release-src
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Port 7878 precheck
        run: |
          mkdir -p "$GAUNTLET_OUT"
          listeners="$(lsof -nP -iTCP:7878 -sTCP:LISTEN 2>/dev/null || true)"
          detail="free"
          if [ -n "$listeners" ]; then
            detail="BUSY: $(printf '%s' "$listeners" | tr '\t\r' '  ' | tr '\n' '|' | head -c 2000)"
          fi
          printf '%s\tport-7878-precheck\tINFO\t0\t%s\n' "$GAUNTLET_CHANNEL" "$detail" >> "$GAUNTLET_OUT/findings.tsv"
          echo "[INFO] port-7878-precheck: $detail"
      - name: Run channel
        run: bash scripts/first-run/plugin-setup.sh
      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: findings-plugin-setup-${{ matrix.os }}
          path: gauntlet-out
          retention-days: 30
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Summary: always runs, renders every findings.tsv into the run summary, then
  # turns the run red when any FAIL row exists so the verdict is visible at the
  # top while every channel still reported.
  # ---------------------------------------------------------------------------

  summary:
    name: Gauntlet summary
    if: always()
    needs:
      - resolve
      - macos-app
      - npx-setup
      - brew
      - npx-mcp
      - linux-install
      - windows-zip
      - windows-nsis
      - cargo-mcp
      - plugin-setup
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # Per-job folders are kept (no merge-multiple) so summary.py can label
      # each findings.tsv by the artifact it came from.
      - name: Download every findings artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: findings-*
          path: all-findings
      - name: Render summary
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          RESOLVE_RESULT: ${{ needs.resolve.result }}
        run: |
          set -euo pipefail
          mkdir -p all-findings
          {
            echo "# First-run gauntlet: ${TAG:-unresolved} (resolve: $RESOLVE_RESULT)"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/first-run/summary.py all-findings >> "$GITHUB_STEP_SUMMARY"
      - name: Upload combined findings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gauntlet-all-findings-${{ needs.resolve.outputs.tag || 'unresolved' }}
          path: all-findings
          retention-days: 30
          if-no-files-found: warn
      - name: Fail on FAIL rows
        # Runs even when rendering crashed so the verdict never depends on
        # summary.py's own health.
        if: always()
        env:
          RESOLVE_RESULT: ${{ needs.resolve.result }}
        run: |
          set -euo pipefail
          status=0
          if [ "$RESOLVE_RESULT" != "success" ]; then
            echo "::error::resolve job ended with '$RESOLVE_RESULT'; no channel could run" >&2
            status=1
          fi
          if failing="$(grep -rl --include=findings.tsv $'\tFAIL\t' all-findings)"; then
            echo "::error::FAIL rows found in:" >&2
            while IFS= read -r path; do
              echo "  $path" >&2
            done <<< "$failing"
            grep -rh --include=findings.tsv $'\tFAIL\t' all-findings | cut -c1-300 >&2
            status=1
          else
            echo "No FAIL rows in any findings.tsv"
          fi
          exit "$status"
