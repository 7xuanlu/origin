name: Main Canary

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  measure-plan:
    name: route main measurements
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      main-canary-required: ${{ steps.plan.outputs.main-canary-required }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Plan main measurements
        id: plan
        env:
          MEASURE_EVENT_NAME: ${{ github.event_name }}
          MEASURE_BEFORE: ${{ github.event.before }}
          MEASURE_HEAD: ${{ github.sha }}
        run: |
          python3 scripts/ci_measure_plan.py \
            --event-name "$MEASURE_EVENT_NAME" \
            --before "$MEASURE_BEFORE" \
            --head "$MEASURE_HEAD" \
            --github-output "$GITHUB_OUTPUT"

  main-canary:
    name: embedding eval
    needs: measure-plan
    if: >-
      always() &&
      (needs.measure-plan.result != 'success' ||
       needs.measure-plan.outputs.main-canary-required == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      SCCACHE_GHA_RW_MODE: READ_ONLY
      FASTEMBED_CACHE_DIR: ${{ github.workspace }}/.fastembed_cache
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master 2026-05-13
        with:
          toolchain: 1.95.0
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@1583d6b38d7be47f593cb472781bbb21cab4321e # v0.0.10
      - name: Enable sccache
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: test
          cache-all-crates: "true"
          cache-targets: "false"
          save-if: "false"
      - name: Install cargo-nextest
        uses: taiki-e/install-action@3235f8901fd37ffed0052b276cec25a362fb82e9 # v2
        with:
          tool: cargo-nextest
      - name: Restore portable FastEmbed model
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.FASTEMBED_CACHE_DIR }}
          key: fastembed-bge-base-en-v1.5-q-v3-portable
          enableCrossOsArchive: "true"
      - name: Verify exact canary inventory
        env:
          CANARY_FILTER: test(=eval::retrieval::tests::test_run_quality_cost_eval_basic) | test(=eval::retrieval_drift::tests::ranking_drift_vs_golden)
        run: |
          cargo nextest list -p wenlan-core --lib \
            --run-ignored=only \
            --ignore-default-filter \
            -E "$CANARY_FILTER" \
            --message-format json > "$RUNNER_TEMP/main-canary-tests.json"
          python3 - "$RUNNER_TEMP/main-canary-tests.json" <<'PY'
          import json
          import sys

          expected = {
              "eval::retrieval::tests::test_run_quality_cost_eval_basic",
              "eval::retrieval_drift::tests::ranking_drift_vs_golden",
          }
          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          matched = {
              name
              for suite in payload.get("rust-suites", {}).values()
              for name, case in suite.get("testcases", {}).items()
              if case.get("filter-match", {}).get("status") == "matches"
              and case.get("ignored") is True
          }
          # nextest's top-level test-count is the full discovered inventory,
          # not the number left after the filter expression.
          if matched != expected or len(matched) != 2:
              raise SystemExit(
                  f"main canary inventory drift: expected={sorted(expected)!r} "
                  f"matched={sorted(matched)!r} matched_count={len(matched)!r} "
                  f"discovered_count={payload.get('test-count')!r}"
              )
          PY
      - name: Run embedding-only eval
        env:
          CANARY_FILTER: test(=eval::retrieval::tests::test_run_quality_cost_eval_basic) | test(=eval::retrieval_drift::tests::ranking_drift_vs_golden)
        run: |
          cargo nextest run -p wenlan-core --lib \
            --run-ignored=only \
            --ignore-default-filter \
            --no-tests=fail \
            -E "$CANARY_FILTER"
