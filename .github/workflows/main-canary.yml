name: Main Canary

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  main-canary:
    name: embedding eval
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      SCCACHE_GHA_RW_MODE: READ_ONLY
      FASTEMBED_CACHE_DIR: ${{ github.workspace }}/.fastembed_cache
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master 2026-05-13
        with:
          toolchain: 1.95.0
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@1583d6b38d7be47f593cb472781bbb21cab4321e # v0.0.10
      - name: Enable sccache
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: test
          cache-all-crates: "true"
          cache-targets: "false"
          save-if: "false"
      - name: Install cargo-nextest
        uses: taiki-e/install-action@3235f8901fd37ffed0052b276cec25a362fb82e9 # v2
        with:
          tool: cargo-nextest
      - name: Restore portable FastEmbed model
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.FASTEMBED_CACHE_DIR }}
          key: fastembed-bge-base-en-v1.5-q-v3-portable
          enableCrossOsArchive: "true"
      - name: Run embedding-only eval
        env:
          EVAL_BASELINES_DIR: ${{ runner.temp }}/origin-eval-canary
        run: cargo nextest run -p wenlan-core --lib --run-ignored=only eval::retrieval
      - name: Upload eval canary baseline
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: eval-canary-baseline-${{ github.sha }}
          path: ${{ runner.temp }}/origin-eval-canary/*.json
          retention-days: 30
          if-no-files-found: warn
