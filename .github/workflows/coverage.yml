name: Coverage (informational)

# Non-blocking coverage report for main and manual runs. Pre-push and the main
# CI lane both skip instrumentation; this workflow keeps visibility without
# slowing the merge gate. See AGENTS.md "Local vs CI test responsibilities".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  measure-plan:
    name: route main measurements
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      coverage-required: ${{ steps.plan.outputs.coverage-required }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Plan main measurements
        id: plan
        env:
          MEASURE_EVENT_NAME: ${{ github.event_name }}
          MEASURE_BEFORE: ${{ github.event.before }}
          MEASURE_HEAD: ${{ github.sha }}
        run: |
          python3 scripts/ci_measure_plan.py \
            --event-name "$MEASURE_EVENT_NAME" \
            --before "$MEASURE_BEFORE" \
            --head "$MEASURE_HEAD" \
            --github-output "$GITHUB_OUTPUT"

  coverage:
    name: Coverage report
    needs: measure-plan
    runs-on: ubuntu-24.04
    if: >-
      always() &&
      (needs.measure-plan.result != 'success' ||
       needs.measure-plan.outputs.coverage-required == 'true')
    timeout-minutes: 60
    # Keep concurrency on the expensive job: a non-owner push must not cancel
    # a valid measurement that is already running.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      # Runtime consumers use the absolute workspace path. The cache action below
      # uses ci.yml's exact relative spelling because the path affects cache version.
      FASTEMBED_CACHE_DIR: ${{ github.workspace }}/.fastembed_cache

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master 2026-05-13
        with:
          toolchain: 1.95.0
          components: llvm-tools-preview

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # Coverage builds with `-C instrument-coverage`, so artifacts are not
          # interchangeable with the `clippy` or `test` caches in ci.yml.
          shared-key: coverage
          cache-targets: "false"
          cache-all-crates: "false"
          # Manual feature-branch runs may restore main's cache but must not
          # create branch-scoped entries that no other ref can reuse.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Cache service availability is only an optimization. The pinned
      # preparer verifies a hit or fills a miss, so a cache-service outage
      # cannot fail this job.
      - name: Restore portable FastEmbed model
        id: fastembed-restore
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .fastembed_cache
          key: fastembed-bge-base-en-v1.5-q-v3-portable
          enableCrossOsArchive: "true"

      - name: Prepare portable FastEmbed model
        run: python3 scripts/prepare-fastembed-cache.py --cache-dir .fastembed_cache

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@3235f8901fd37ffed0052b276cec25a362fb82e9 # v2
        with:
          tool: cargo-llvm-cov

      - name: Run Rust coverage (wenlan-core + wenlan-server)
        run: |
          cargo llvm-cov --package wenlan-core --package wenlan-server \
            --no-report
          cargo llvm-cov report \
            --summary-only --json --output-path rust-coverage.json
          cargo llvm-cov report

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage-reports
          path: rust-coverage.json
          retention-days: 7
          if-no-files-found: error
