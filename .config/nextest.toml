# nextest configuration. Loaded automatically by cargo-nextest from
# .config/nextest.toml or .cargo/nextest.toml at the workspace root.
#
# https://nexte.st/docs/configuration/

# Static workflow and repository contracts are fast and high signal. Run them
# before database-heavy tests so routing/config drift fails near the start of
# its shard instead of after hundreds of unrelated tests.
[[profile.default.overrides]]
filter = 'test(/^drift_guard::/)'
priority = 100

# Full-daemon process tests synchronously initialize FastEmbed before the
# child publishes its port. The cross-process model-cache lock prevents
# corruption, but under nextest concurrency it can also make these children
# queue behind unrelated DB tests. Reserve the complete runner pool so startup
# readiness is measured without artificial lock contention.
[[profile.default.overrides]]
filter = 'binary(=graceful_shutdown) | binary(=port_discovery)'
threads-required = "num-test-threads"

# The folder-ingest pipeline is normally well under a minute (23s in the
# focused local run). If its queue stops making progress, fail with evidence
# instead of occupying a CI runner for an hour.
[[profile.default.overrides]]
filter = 'test(folder_ingest_full_pipeline_e2e)'
slow-timeout = { period = "60s", terminate-after = 3 }

# These tests contend on a shared flock; the in-process mutex in bind_addr_tests.rs never engages under nextest's process-per-test model.
[[profile.default.overrides]]
filter = 'test(/^bind_addr_tests::data_root_lock_/)'
retries = 2

# p95 bar spikes under parallel-cargo load; a load flake passes on retry, a real regression fails all attempts.
[[profile.default.overrides]]
filter = 'test(m4_real_job_mutex_and_correction_latency_gate)'
retries = 2

# One unattributed setup failure under parallel load; retry rather than pin a diagnosis.
[[profile.default.overrides]]
filter = 'test(back_pressure_holds_sweep_at_pending_cap)'
retries = 2

