[package]
name = "wenlan-app"
version = "0.17.0" # x-release-please-version
edition = "2021"
license = "AGPL-3.0-only"
default-run = "wenlan-app"
# Never published to crates.io: it's the AGPL bundle app and carries a git dep
# (tauri-plugin-mcp) that would make `cargo publish` fail anyway.
publish = false

[lib]
name = "wenlan_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = []
review-fixtures = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-x = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"

# Dev-only: gives Claude Code / MCP clients control over the running app
# (screenshots, DOM, click/type). Excluded from release builds via debug_assertions.
tauri-plugin-mcp = { git = "https://github.com/P3GLEG/tauri-plugin-mcp" }

# Async
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
plist = "1"
base64 = "0.22"

# File watching
notify = { version = "7", features = ["macos_kqueue"] }
notify-debouncer-full = "0.4"

# HTTP client for wenlan-server daemon
reqwest = { version = "0.12", default-features = false, features = ["json", "charset", "http2", "system-proxy", "rustls-tls-native-roots"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Utilities
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hmac = { workspace = true }
getrandom = "0.2"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
log = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "tracing-log"] }
tracing-appender = "0.2"
tracing = "0.1"
dirs = "6"
async-trait = "0.1"
tempfile = "3"
open = "5"

# Workspace crates
wenlan-types = { workspace = true }
# Workspace-pinned (=0.38.3): the scheduler tooth requires exactly one sysinfo in Cargo.lock
sysinfo = { workspace = true }
pdf-extract = "0.10"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

# Keep this table LAST. A TOML table runs until the next header, so any
# dependency written below it silently becomes macOS-only. That is how
# wenlan-types, sysinfo, pdf-extract, and zip stopped existing off macOS and
# left the app crate uncompilable on Windows (15 unresolved-import errors,
# unnoticed because app-check only runs on macOS).
[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"
raw-window-handle = "0.6"

[dev-dependencies]
serial_test = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy", "review-fixtures"))'] }
